<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Map mock — network, ride, day</title>
<style>
:root{
  --paper:#f6f1ea; --ink:#1c1916; --mute:#6f675e; --line:#ddd4c8;
  --route:#f0713f; --gold:#c9a227; --card:#fffdf8; --land:#e7dfd2; --water:#c5d5de;
  --ghost:#c4b8a8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);
  font:15px/1.45 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
#app{display:grid;grid-template-columns:340px 1fr;height:100%}
#side{overflow:auto;background:var(--paper);border-right:1px solid var(--line);padding:0 0 28px}
#stage{position:relative;background:#efe8dc;overflow:hidden}
svg{width:100%;height:100%;display:block;cursor:grab}
h1{font-family:Georgia,"Iowan Old Style",serif;font-size:26px;margin:18px 18px 4px;font-weight:600}
.kicker,.sub{margin:0 18px;color:var(--mute);font-size:13px}
.back{display:inline-flex;margin:16px 18px 0;color:var(--mute);font-size:13px;cursor:pointer;border:0;background:none;font:inherit;padding:0;text-decoration:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 18px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:12px;color:var(--mute);cursor:pointer;font:inherit}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.stats{display:flex;gap:16px;margin:12px 18px 10px}
.stats b{display:block;font-size:20px;font-weight:600}
.stats span{font-size:11px;color:var(--mute)}
.tcard,.day{margin:0 14px 8px;border:1px solid var(--line);background:var(--card);border-radius:12px;cursor:pointer;overflow:hidden}
.tcard{display:grid;grid-template-columns:72px 1fr}
.tcard.hl,.day.on{border-color:var(--route)}
.tcard .ph{background:#cfc4b4 center/cover}
.tcard .b{padding:8px 10px}
.tn{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#efe8dc;color:var(--ink);font-size:10px;font-weight:700}
.badge.route{background:var(--route);color:#fff}
.why,.tm{font-size:12px;color:var(--mute);margin:2px 0 0}
.day{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:8px 10px}
.day .n{color:var(--mute);font-size:12px}
.day.on{background:#fff6ea}
.hint{position:absolute;left:14px;bottom:12px;font-size:12px;color:var(--mute);background:rgba(246,241,234,.92);padding:4px 8px;border-radius:6px;border:1px solid var(--line)}
#legend{position:absolute;right:14px;top:12px;display:flex;flex-direction:column;gap:4px}
#legend button{font-size:11px;background:var(--card)}
#pop{display:none;position:absolute;z-index:5;max-width:240px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;box-shadow:0 4px 16px rgba(28,25,22,.12)}
#pop b{display:block} #pop .cta{color:var(--route);margin-top:4px;font-size:12px}
.chip-photo{stroke:#fff;stroke-width:2}
#titlebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.note{margin:14px 18px 0;font-size:12px;color:var(--mute);border-left:3px solid var(--route);padding-left:10px}
.dl{font-size:10px;font-weight:600;border:1px solid;border-radius:9px;padding:1px 6px;white-space:nowrap}
.dl0{color:#3d6b1e;border-color:#97C459}
.dl1{color:#8a5a10;border-color:#EF9F27}
.dl2{color:#c45a28;border-color:#f07d3f}
.dl3{color:#a32d2c;border-color:#E24B4A}
.spark{display:block;width:100%;height:28px;margin-top:6px}
#profwrap{margin:4px 18px 8px}
#profwrap svg{display:block;width:100%;height:56px;border-radius:4px;background:#efe8dc;border:1px solid var(--line)}
#proflbl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mute);margin-top:3px}
#strip{display:flex;height:14px;border-radius:3px;overflow:hidden;gap:1px;margin:0 18px;background:var(--line)}
#friendleg{margin:4px 18px 12px;font-size:11px;color:var(--mute);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#friendleg i{width:9px;height:9px;border-radius:2px;display:inline-block}
.bar{grid-column:2/4;height:3px;background:#efe8dc;border-radius:2px}
.bar i{display:block;height:100%;background:var(--route);border-radius:2px}
.day{grid-template-columns:28px 1fr auto;grid-template-rows:auto auto auto auto}
.day svg.spark{grid-column:2/4;height:26px;margin:0}
.pills{margin-left:auto;display:flex;gap:4px;align-items:center}
@media(max-width:760px){
  #app{grid-template-columns:1fr;grid-template-rows:42vh 1fr}
  #stage{order:0;border-bottom:1px solid var(--line)}#side{order:1;border-right:0}
}
</style>
</head>
<body>
<div id="app">
  <div id="side"></div>
  <div id="stage">
    <svg id="map" viewBox="0 0 900 640" preserveAspectRatio="xMidYMid meet">
      <path id="land" fill="#e7dfd2" stroke="#cbbfaf" stroke-width="1.4"
        d="M90,470 C70,420 55,320 80,210 C100,90 180,40 280,50 C400,30 520,55 640,80 C740,70 820,110 850,200 C870,280 840,360 800,400 C760,470 680,540 560,560 C480,600 420,590 380,540 C320,560 220,530 90,470 Z"/>
      <ellipse cx="118" cy="448" rx="52" ry="22" fill="#c5d5de" stroke="#a8c0cc" transform="rotate(-18 118 448)"/>
      <ellipse cx="210" cy="300" rx="38" ry="14" fill="#c5d5de" stroke="#a8c0cc"/>
      <ellipse cx="402" cy="268" rx="28" ry="16" fill="#c5d5de" stroke="#a8c0cc"/>
      <ellipse cx="508" cy="528" rx="22" ry="28" fill="#c5d5de" stroke="#a8c0cc"/>
      <ellipse cx="640" cy="98" rx="48" ry="18" fill="#c5d5de" stroke="#a8c0cc"/>
      <g id="ghost"></g>
      <g id="lines"></g>
      <g id="days"></g>
      <g id="photos"></g>
      <g id="badges"></g>
    </svg>
    <div id="legend"></div>
    <div id="hint"></div>
    <div id="pop"></div>
  </div>
</div>
<script>
const PH = {
  furka:"img/furka.jpg", lucerne:"img/lucerne.jpg", lavaux:"img/lavaux.jpg",
  gletsch:"img/gletsch.jpg", japan:"img/japan.jpg", fisterra:"img/fisterra.jpg"
};
const DNAME=["easy","moderate","hard","very hard"];
function grade(km,asc){ const r=asc/km; return r<8?0:r<14?1:r<20?2:3; }
function sparkPts(el,w,h){
  const mx=Math.max.apply(null,el), mn=Math.min.apply(null,el), span=Math.max(mx-mn,120);
  return el.map((z,i)=>(i/(el.length-1)*w).toFixed(1)+","+(h-3-(z-mn)/span*(h-8)).toFixed(1)).join(" ");
}
function sparkSVG(el,w,h){
  if(!el||el.length<2) return "";
  const pts=sparkPts(el,w,h);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="0,${h} ${pts} ${w},${h}" fill="#f0713f" fill-opacity=".18" stroke="none"/><polyline points="${pts}" fill="none" stroke="#f0713f" stroke-width="1.3" vector-effect="non-scaling-stroke"/></svg>`;
}
function profileSVG(t){
  const stops=t.stops;
  if(!stops||!stops.length){
    const el=t.elev||[];
    return sparkSVG(el,300,56)+`<div id="proflbl"><span>▲ ${(el.length?Math.max.apply(null,el):0).toLocaleString()} m</span><span>whole trip</span><span>▼ ${(el.length?Math.min.apply(null,el):0).toLocaleString()} m</span></div>`;
  }
  const W=300,H=56, tot=stops.reduce((a,s)=>a+s.km,0);
  const all=stops.flatMap(s=>s.elev||[]);
  const hi=Math.max.apply(null,all), lo=Math.min.apply(null,all), span=Math.max(hi-lo,150);
  let off=0, pts=[], bands="";
  stops.forEach(s=>{
    const w=s.km/tot*W, sel=day===s.n;
    bands+=`<rect class="pband" data-day="${s.n}" x="${off.toFixed(1)}" y="0" width="${w.toFixed(1)}" height="${H}" fill="${sel?"#f3e2c4":(s.n%2?"#efe8dc":"#f6f1ea")}" style="cursor:pointer"/>`;
    if(w>18) bands+=`<text x="${(off+3).toFixed(1)}" y="${H-5}" font-size="9" fill="#6f675e" font-family="inherit" style="pointer-events:none">${s.n}</text>`;
    (s.elev||[]).forEach((z,i,a)=>{
      const x=off+(i/(Math.max(a.length-1,1)))*w, y=4+(1-(z-lo)/span)*(H-12);
      pts.push(x.toFixed(1)+","+y.toFixed(1));
    });
    off+=w;
  });
  const d=pts.join(" ");
  return `<svg id="prof" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${bands}<polyline points="0,${H} ${d} ${W},${H}" fill="#f0713f" fill-opacity=".2" stroke="none"/><polyline points="${d}" fill="none" stroke="#f0713f" stroke-width="1.4" vector-effect="non-scaling-stroke"/></svg>
    <div id="proflbl"><span>▲ ${Math.round(hi).toLocaleString()} m</span><span>coloured by day</span><span>▼ ${Math.round(lo).toLocaleString()} m</span></div>`;
}
function friendHTML(t){
  const s=t.friend; if(!s) return "";
  const col={g:"#97C459",y:"#EF9F27",r:"#E24B4A"};
  const cells=[...s].map(c=>`<div style="flex:1;background:${col[c]}"></div>`).join("");
  return `<div id="strip">${cells}</div>
    <div id="friendleg"><span><i style="background:#97C459"></i>signed / quiet</span><span><i style="background:#EF9F27"></i>minor / mixed</span><span><i style="background:#E24B4A"></i>busy road</span></div>`;
}
const TRIPS = [
  {id:"ew", num:"E–W", name:"East–West crossing", kind:"crossing",
   sub:"Müstair → Genève", km:605, asc:4768, daysN:11, eff:1081,
   why:"The whole country, east to west.",
   d:"820,300 620,340 430,140 250,260 140,430 90,470",
   photo:PH.fisterra,
   elev:[1240,1480,1800,2113,1650,1100,720,430,375]},
  {id:"r1", num:"1", name:"Rhône", kind:"route",
   sub:"Andermatt → Genève", km:306, asc:1888, daysN:6, eff:493,
   why:"Glacier source, the Valais, the Lavaux vineyards.",
   d:"455,360 420,400 340,430 190,400 175,410 140,430 90,470",
   photo:PH.furka, friend:"ggggggggggyggggggggg",
   stops:[
     {n:1, name:"Andermatt → Oberwald", km:38, eff:148, x:438, y:380, seg:"455,360 420,400", elev:[1444,1880,2431,2100,1368], photos:[{src:PH.furka,label:"Furka"},{src:PH.gletsch,label:"Gletsch"}]},
     {n:2, name:"Oberwald → Brig", km:44, eff:70, x:380, y:415, seg:"420,400 340,430", elev:[1368,1100,820,670], photos:[{src:PH.gletsch,label:"Rhône valley"}]},
     {n:3, name:"Brig → Sion", km:48, eff:62, x:265, y:418, seg:"340,430 190,400", elev:[670,620,540,490], photos:[{src:PH.lavaux,label:"Valais vines"},{src:PH.lucerne,label:"Sion"}]},
     {n:4, name:"Sion → Aigle", km:41, eff:55, x:200, y:405, seg:"190,400 175,410", elev:[490,530,430,420], photos:[{src:PH.lavaux,label:"Aigle"}]},
     {n:5, name:"Aigle → Lausanne", km:38, eff:58, x:158, y:420, seg:"175,410 140,430", elev:[420,510,450,400], photos:[{src:PH.lavaux,label:"Lavaux"}]},
     {n:6, name:"Lausanne → Genève", km:62, eff:70, x:110, y:450, seg:"140,430 90,470", elev:[400,390,380,375], photos:[{src:PH.lavaux,label:"Lake Geneva"}]}
   ]},
  {id:"r9", num:"9", name:"Lakes", kind:"route",
   sub:"St. Gallen → Montreux", km:362, asc:4490, daysN:8, eff:811,
   why:"Ten lakes, Luzern, Lavaux.",
   d:"620,120 430,140 402,268 320,340 210,380 175,410",
   photo:PH.lucerne,
   elev:[670,820,430,450,800,434,720,375]},
  {id:"r99", num:"99", name:"Heart Route", kind:"route",
   sub:"Rorschach → Lausanne", km:606, asc:9206, daysN:15, eff:1528,
   why:"Quiet hills, the e-bike classic.",
   d:"640,98 560,180 430,220 330,300 210,360 140,430",
   photo:PH.lavaux,
   elev:[400,720,540,980,610,1100,700,900,650,420]},
  {id:"loop3", num:"◆", name:"Three passes loop", kind:"section",
   sub:"Andermatt → Andermatt", km:140, asc:4416, daysN:6, eff:581,
   why:"Susten, Grimsel and Furka in one circuit.",
   d:"455,360 500,320 455,290 400,330 420,400 455,360",
   photo:PH.gletsch,
   elev:[1444,2224,1440,2164,1368,2431,1444]}
];

let mode="network", ride=null, day=null, hover=null, layers={crossing:true, route:true, section:false};

function visible(t){
  if(t.kind==="crossing") return layers.crossing;
  if(t.kind==="route") return layers.route;
  return layers.section;
}
function trip(id){ return TRIPS.find(t=>t.id===id); }

function draw(){
  const gL=document.getElementById("lines"), gB=document.getElementById("badges");
  const gD=document.getElementById("days"), gP=document.getElementById("photos"), gG=document.getElementById("ghost");
  [gL,gB,gD,gP,gG].forEach(g=>g.innerHTML="");
  const show = TRIPS.filter(visible);
  const active = hover || (ride && ride.id);
  TRIPS.forEach(t=>{
    const on = visible(t);
    const isRide = ride && ride.id===t.id;
    const dim = mode!=="network" ? !isRide : (active && t.id!==active);
    const p=document.createElementNS("http://www.w3.org/2000/svg","polyline");
    p.setAttribute("points", t.d);
    p.setAttribute("fill","none");
    p.setAttribute("stroke-linecap","round");
    p.setAttribute("stroke-linejoin","round");
    if(!on && mode==="network"){ p.setAttribute("stroke","#d4c9ba"); p.setAttribute("stroke-width","1.2"); p.setAttribute("opacity",".4"); gG.appendChild(p); return; }
    if(mode!=="network" && !isRide){
      p.setAttribute("stroke","#c4b8a8"); p.setAttribute("stroke-width","1.4"); p.setAttribute("stroke-dasharray","4 5"); p.setAttribute("opacity",".7");
      p.style.cursor="pointer";
      p.addEventListener("click",e=>{ e.stopPropagation(); openRide(t.id); });
      gG.appendChild(p); return;
    }
    const hl = (mode==="network" && t.id===active) || isRide;
    const rideQuiet = isRide && mode==="day";
    p.setAttribute("stroke", hl ? "#f0713f" : (t.kind==="crossing"?"#8a7f72": t.kind==="section"?"#b8aea0":"#8a7f72"));
    p.setAttribute("stroke-width", hl ? (rideQuiet?3.4:5) : (t.kind==="section"?2:3.2));
    if(t.kind==="crossing" && !hl) p.setAttribute("stroke-dasharray","7 5");
    p.setAttribute("opacity", dim?".28": (rideQuiet?".55":"1"));
    p.style.cursor="pointer";
    p.dataset.id=t.id;
    p.addEventListener("mouseenter",()=>setHover(t.id));
    p.addEventListener("mouseleave",()=>setHover(null));
    p.addEventListener("click",e=>{
      e.stopPropagation();
      if(isRide){ if(mode==="day") openDay(day); return; }
      openRide(t.id);
    });
    gL.appendChild(p);
    if(mode==="network" || isRide){
      const pt=t.d.split(" ")[0].split(","), x=+pt[0], y=+pt[1];
      const g=document.createElementNS("http://www.w3.org/2000/svg","g");
      const w=Math.max(22, String(t.num).length*7+12);
      const r=document.createElementNS("http://www.w3.org/2000/svg","rect");
      r.setAttribute("x", x-w/2); r.setAttribute("y", y-10); r.setAttribute("width", w); r.setAttribute("height", 20); r.setAttribute("rx",10);
      r.setAttribute("fill", hl?"#f0713f":"#fffdf8");
      r.setAttribute("stroke", hl?"#f0713f":"#cbbfaf");
      r.setAttribute("stroke-width","1");
      const tx=document.createElementNS("http://www.w3.org/2000/svg","text");
      tx.setAttribute("x",x); tx.setAttribute("y",y+4); tx.setAttribute("text-anchor","middle");
      tx.setAttribute("fill", hl?"#fff":"#1c1916"); tx.setAttribute("font-size","11"); tx.setAttribute("font-weight","700"); tx.setAttribute("font-family","inherit");
      tx.textContent=t.num;
      g.appendChild(r); g.appendChild(tx);
      g.style.cursor="pointer";
      g.addEventListener("mouseenter",()=>setHover(t.id));
      g.addEventListener("click",e=>{ e.stopPropagation(); openRide(t.id); });
      gB.appendChild(g);
    }
  });
  if(mode!=="network" && ride && ride.stops){
    if(day){
      const s=ride.stops.find(x=>x.n===day);
      if(s && s.seg){
        const gold=document.createElementNS("http://www.w3.org/2000/svg","polyline");
        gold.setAttribute("points", s.seg);
        gold.setAttribute("fill","none");
        gold.setAttribute("stroke","#c9a227");
        gold.setAttribute("stroke-width","10");
        gold.setAttribute("stroke-linecap","round");
        gold.setAttribute("stroke-linejoin","round");
        gold.setAttribute("opacity",".92");
        gL.appendChild(gold);
      }
    }
    ride.stops.forEach(s=>{
      const c=document.createElementNS("http://www.w3.org/2000/svg","circle");
      c.setAttribute("cx",s.x); c.setAttribute("cy",s.y); c.setAttribute("r", day===s.n?10:7);
      c.setAttribute("fill", day===s.n?"#c9a227":"#fffdf8");
      c.setAttribute("stroke","#1c1916");
      c.setAttribute("stroke-width","2");
      c.style.cursor="pointer";
      c.addEventListener("click",e=>{ e.stopPropagation(); openDay(s.n); });
      const t=document.createElementNS("http://www.w3.org/2000/svg","text");
      t.setAttribute("x",s.x); t.setAttribute("y",s.y+4); t.setAttribute("text-anchor","middle");
      t.setAttribute("fill","#1c1916"); t.setAttribute("font-size","9"); t.setAttribute("font-weight","700"); t.setAttribute("font-family","inherit");
      t.textContent=s.n; t.style.pointerEvents="none";
      gD.appendChild(c); gD.appendChild(t);
    });
    if(day){
      const s=ride.stops.find(x=>x.n===day);
      if(s){
        (s.photos||[]).forEach((ph,i)=>{
          const x=s.x+22+i*56, y=s.y-42;
          const img=document.createElementNS("http://www.w3.org/2000/svg","image");
          img.setAttributeNS("http://www.w3.org/1999/xlink","href", ph.src);
          img.setAttribute("href", ph.src);
          img.setAttribute("x",x); img.setAttribute("y",y); img.setAttribute("width",48); img.setAttribute("height",36);
          img.setAttribute("preserveAspectRatio","xMidYMid slice");
          const rr=document.createElementNS("http://www.w3.org/2000/svg","rect");
          rr.setAttribute("x",x-1); rr.setAttribute("y",y-1); rr.setAttribute("width",50); rr.setAttribute("height",38); rr.setAttribute("rx",6);
          rr.setAttribute("fill","#fff"); rr.setAttribute("stroke","#1c1916"); rr.setAttribute("stroke-width",".6");
          gP.appendChild(rr); gP.appendChild(img);
          img.addEventListener("click",e=>{ e.stopPropagation(); showPop(x+24,y, ph.label, "on this day’s stretch"); });
        });
      }
    }
  }
  setView();
  side();
  hint();
  pop();
}

function setView(){
  const svg=document.getElementById("map");
  if(mode==="day" && ride && ride.stops){
    const s=ride.stops.find(x=>x.n===day);
    const pts=(s.seg||(s.x+","+s.y)).split(" ").map(p=>p.split(",").map(Number));
    const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
    const minX=Math.min(...xs), maxX=Math.max(...xs);
    const minY=Math.min(...ys), maxY=Math.max(...ys);
    const pad=120;
    const w=Math.max(320, maxX-minX+pad*2);
    const h=Math.max(240, maxY-minY+pad*2);
    svg.setAttribute("viewBox", `${(minX+maxX)/2-w/2} ${(minY+maxY)/2-h/2} ${w} ${h}`);
  } else {
    svg.setAttribute("viewBox","0 0 900 640");
  }
}

function setHover(id){ hover=id; draw(); }
function openRide(id){
  ride=trip(id); mode="ride"; day=null; hover=null;
  location.hash="ride="+id;
  draw();
}
function openDay(n){
  if(!ride) return;
  day = (day===n)?null:n;
  mode = day?"day":"ride";
  location.hash = day ? "ride="+ride.id+"&day="+day : "ride="+ride.id;
  draw();
}
function goNetwork(){ mode="network"; ride=null; day=null; hover=null; location.hash="network"; draw(); }

function side(){
  const el=document.getElementById("side");
  if(mode==="network"){
    el.innerHTML = `<a class="back" href="hub.html">‹ Where to ride</a>
      <h1>Switzerland by bike</h1>
      <p class="sub">Hover a line or a card. Click to make it the ride. Days are computed after that.</p>
      <div class="chips" id="filters"></div>
      <p class="kicker" style="margin-top:8px">Trips · ${TRIPS.filter(visible).length}</p>
      <div id="cards"></div>
      <p class="note">Mock of the map model — not the live planner. Crossings dashed, numbered routes solid, sections quieter.</p>`;
    const f=document.getElementById("filters");
    [["crossing","crossings"],["route","national routes"],["section","sections / passes"]].forEach(([k,lab])=>{
      const b=document.createElement("button"); b.className="chip"+(layers[k]?" on":""); b.textContent=lab;
      b.onclick=()=>{ layers[k]=!layers[k]; draw(); };
      f.appendChild(b);
    });
    const box=document.getElementById("cards");
    TRIPS.forEach(t=>{
      if(!visible(t)) return;
      const d=document.createElement("div");
      d.className="tcard"+(hover===t.id?" hl":"");
      d.innerHTML=`<div class="ph" style="background-image:url('${t.photo}')"></div>
        <div class="b"><div class="tn"><span class="badge ${t.kind==="route"?"route":""}">${t.num}</span>${t.name}
        <span class="pills"><span class="dl dl${grade(t.km,t.asc)}">${DNAME[grade(t.km,t.asc)]}</span></span></div>
        <div class="why">${t.why}</div><div class="tm">${t.sub} · ${t.km} km · ${t.asc.toLocaleString()} m · ~${t.daysN} days</div></div>`;
      d.onmouseenter=()=>setHover(t.id);
      d.onmouseleave=()=>setHover(null);
      d.onclick=()=>openRide(t.id);
      box.appendChild(d);
    });
  } else {
    const t=ride;
    const stops=t.stops||[];
    el.innerHTML = `<button class="back" id="up">‹ All 5 trips on this mock</button>
      <h1 id="titlebar"><span class="badge route">${t.num}</span> ${t.name} <span class="dl dl${grade(t.km,t.asc)}">${DNAME[grade(t.km,t.asc)]}</span></h1>
      <p class="sub">${t.sub} · ${t.why}</p>
      <div class="stats"><div><b>${stops.length||t.daysN}</b><span>days</span></div><div><b>${t.km}</b><span>km</span></div><div><b>${t.asc.toLocaleString()}</b><span>m climbed</span></div></div>
      <div id="profwrap">${profileSVG(t)}</div>
      ${friendHTML(t)}
      <p class="kicker">Days — click one to zoom that stretch</p>
      <div id="dayslist"></div>
      ${day?`<button class="back" id="whole" style="margin-top:8px">Whole trip</button>`:""}
      <p class="note">${day?"Day "+day+" is the section: the map zooms, gold on that stretch, photo chips on the line. The profile band matches.":"Coral line = the ride. The profile is coloured by computed days. Ghost dashes switch ride."}</p>`;
    document.getElementById("up").onclick=goNetwork;
    const whole=document.getElementById("whole");
    if(whole) whole.onclick=()=>openDay(day);
    el.querySelectorAll(".pband").forEach(r=>{
      r.addEventListener("click",e=>{ e.stopPropagation(); openDay(+r.dataset.day); });
    });
    const box=document.getElementById("dayslist");
    (stops.length?stops:[{n:1,name:t.sub,km:t.km,eff:t.eff,elev:t.elev}]).forEach(s=>{
      const d=document.createElement("div");
      d.className="day"+(day===s.n?" on":"");
      const maxE=Math.max.apply(null,(stops.length?stops:[{eff:s.eff}]).map(x=>x.eff||t.eff||1));
      d.innerHTML=`<div class="n">${s.n}</div><div>${s.name}</div><div class="n">${s.km} km · ${s.eff||"–"} eff</div>
        <div class="bar"><i style="width:${Math.round(100*(s.eff||0)/maxE)}%"></i></div>
        ${sparkSVG(s.elev||t.elev, 220, 26)}`;
      d.onclick=()=>openDay(s.n);
      box.appendChild(d);
    });
  }
  const lg=document.getElementById("legend");
  lg.innerHTML="";
  if(mode==="network"){
    [["crossing","crossings"],["route","routes"],["section","sections"]].forEach(([k,lab])=>{
      const b=document.createElement("button"); b.className="chip"+(layers[k]?" on":""); b.textContent=lab;
      b.onclick=()=>{ layers[k]=!layers[k]; draw(); }; lg.appendChild(b);
    });
  }
}
function hint(){
  document.getElementById("hint").textContent =
    mode==="network" ? "Hover a line to isolate it · click it (or its card) to ride it" :
    mode==="day" ? "Photo chips are sights on this day · click the day again for the whole ride" :
    "Click a numbered day to zoom that section · ghost lines switch ride";
}
function showPop(x,y,title,sub){
  const pop=document.getElementById("pop"), st=document.getElementById("stage").getBoundingClientRect(), svg=document.getElementById("map").getBoundingClientRect();
  pop.style.display="block";
  pop.innerHTML=`<b>${title}</b><div class="sub" style="margin:0">${sub||""}</div><div class="cta">on the line ›</div>`;
  pop.style.left=Math.min(st.width-250, 40+x*(svg.width/900))+"px";
  pop.style.top=Math.max(8, y*(svg.height/640)-20)+"px";
}
function pop(){
  const pop=document.getElementById("pop");
  if(mode!=="network" || !hover){ if(mode!=="day") pop.style.display="none"; return; }
  const t=trip(hover); if(!t) return;
  const pt=t.d.split(" ")[0].split(",");
  showPop(+pt[0], +pt[1], t.num+" · "+t.name, t.sub+" · "+t.km+" km");
  pop.querySelector(".cta").textContent="click to ride it ›";
}

document.getElementById("map").addEventListener("click",()=>{
  if(mode==="day"){ openDay(day); }
  else if(mode==="ride") goNetwork();
  else setHover(null);
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ if(day){ day=null; mode="ride"; location.hash="ride="+ride.id; draw(); } else if(mode!=="network") goNetwork(); }});

(function start(){
  const h=location.hash.replace("#","");
  const p=Object.fromEntries(h.split("&").filter(Boolean).map(s=>s.split("=")));
  if(p.ride && trip(p.ride)){ ride=trip(p.ride); mode="ride"; if(p.day){ day=+p.day; mode="day"; } }
  else mode="network";
  draw();
})();
</script>
</body>
</html>
