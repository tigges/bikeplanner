<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Switzerland · planner</title>
<style>
:root{
  --paper:#f6f1ea; --ink:#1c1916; --mute:#6f675e; --line:#ddd4c8;
  --route:#f0713f; --gold:#c9a227; --card:#fffdf8; --land:#e7dfd2; --water:#c5d5de;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font:16px/1.5 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
header{padding:22px 24px 0;max-width:1120px;margin:0 auto}
a.back,button.back{font-size:13px;color:var(--mute);text-decoration:none;border:0;background:none;font:inherit;cursor:pointer;padding:0}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:10px 0 8px}
h1{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;font-weight:600;
  font-size:clamp(28px,4vw,40px);letter-spacing:-.02em;margin:0 0 6px;line-height:1.1}
.lede{color:var(--mute);margin:0 0 16px;max-width:42em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--mute);cursor:pointer;font:inherit;background:transparent}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
main{max-width:1120px;margin:0 auto;padding:0 24px 56px}
.split{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:22px;align-items:start}
.tcard{display:grid;grid-template-columns:112px 1fr;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;margin:0 0 12px}
.tcard.hl{border-color:var(--route)}
.tcard .ph{background:#cfc4b4 center/cover no-repeat;min-height:92px}
.tcard .b{padding:12px 14px}
.tn{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tn h2{font-family:Georgia,serif;font-size:18px;margin:0;font-weight:600}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--route);color:#fff;font-size:11px;font-weight:700}
.why{font-size:13.5px;color:#3f3a34;margin:4px 0 0}
.tm{font-size:12px;color:var(--mute);margin-top:6px}
.dl{font-size:10px;font-weight:600;border:1px solid;border-radius:9px;padding:1px 6px;white-space:nowrap}
.dl0{color:#3d6b1e;border-color:#97C459}
.dl1{color:#8a5a10;border-color:#EF9F27}
.dl2{color:#c45a28;border-color:#f07d3f}
.dl3{color:#a32d2c;border-color:#E24B4A}
.title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 4px}
.title-row h1{margin:0}
.stats{display:flex;gap:28px;margin:18px 0 22px}
.stats b{display:block;font-family:Georgia,serif;font-size:28px;font-weight:600;line-height:1.1}
.stats span{font-size:12px;color:var(--mute)}
.block{margin:0 0 22px}
.block h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:0 0 8px;font-weight:600}
#profwrap svg{display:block;width:100%;height:72px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
#proflbl{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:6px}
#strip{display:flex;height:10px;border-radius:999px;overflow:hidden;gap:1px;background:var(--line)}
#friendleg{margin-top:8px;font-size:12px;color:var(--mute);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
#friendleg i{width:9px;height:9px;border-radius:2px;display:inline-block}
.dayrow{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.dayrow:first-child{border-top:1px solid var(--line)}
.dayrow .n{width:22px;height:22px;border-radius:11px;background:var(--route);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.dayrow .name{font-weight:600;font-size:14.5px}
.dayrow .meta{font-size:12px;color:var(--mute)}
.dayrow .km{font-size:12px;color:var(--mute);white-space:nowrap}
.dayrow.on .n{background:var(--gold);color:#1c1916}
.dayrow.on .name{color:var(--ink)}
.dayrow.on .km{color:var(--ink);font-weight:600}
.spark{display:block;width:100%;height:28px;margin-top:6px}
.photos{display:flex;gap:8px;margin-top:12px}
.photos div{display:flex;flex-direction:column;gap:4px}
.photos img{width:112px;height:80px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.mapcard{background:#efe8dc;border:1px solid var(--line);border-radius:16px;overflow:hidden;position:sticky;top:16px;min-height:640px;height:calc(100vh - 40px)}
.mapcard svg{width:100%;height:100%;display:block}
#pop{display:none;position:absolute;z-index:5;max-width:220px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;box-shadow:0 4px 16px rgba(28,25,22,.12)}
#pop b{display:block} #pop .cta{color:var(--route);margin-top:4px;font-size:12px}
.note{margin-top:18px;padding:12px 0 0;border-top:1px solid var(--line);color:var(--mute);font-size:13px}
footer{max-width:1120px;margin:0 auto;padding:0 24px 40px;color:var(--mute);font-size:13px}
@media(max-width:860px){
  .split{grid-template-columns:1fr}
  .mapcard{position:relative;top:0;height:42vh;min-height:280px;order:-1}
}
</style>
</head>
<body>
<header id="head"></header>
<main>
  <div class="split">
    <div id="col"></div>
    <aside class="mapcard" id="stage">
      <svg id="map" viewBox="0 0 900 640" preserveAspectRatio="xMidYMid meet">
        <path id="land" fill="#e7dfd2" stroke="#cbbfaf" stroke-width="1.4"
          d="M90,470 C70,420 55,320 80,210 C100,90 180,40 280,50 C400,30 520,55 640,80 C740,70 820,110 850,200 C870,280 840,360 800,400 C760,470 680,540 560,560 C480,600 420,590 380,540 C320,560 220,530 90,470 Z"/>
        <ellipse cx="118" cy="448" rx="52" ry="22" fill="#c5d5de" stroke="#a8c0cc" transform="rotate(-18 118 448)"/>
        <ellipse cx="210" cy="300" rx="38" ry="14" fill="#c5d5de" stroke="#a8c0cc"/>
        <ellipse cx="402" cy="268" rx="28" ry="16" fill="#c5d5de" stroke="#a8c0cc"/>
        <ellipse cx="508" cy="528" rx="22" ry="28" fill="#c5d5de" stroke="#a8c0cc"/>
        <ellipse cx="640" cy="98" rx="48" ry="18" fill="#c5d5de" stroke="#a8c0cc"/>
        <g id="ghost"></g>
        <g id="lines"></g>
        <g id="days"></g>
        <g id="names" fill="#6f675e" font-size="11" font-family="Georgia, serif"></g>
        <g id="badges"></g>
      </svg>
      <div id="pop"></div>
    </aside>
  </div>
</main>
<footer>Design preview. Same paper as the hub and gallery — the map is a figure, not a second product.</footer>
<script>
const PH = {
  furka:"img/furka.jpg", lucerne:"img/lucerne.jpg", lavaux:"img/lavaux.jpg",
  gletsch:"img/gletsch.jpg", japan:"img/japan.jpg", fisterra:"img/fisterra.jpg"
};
const DNAME=["easy","moderate","hard","very hard"];
function grade(km,asc){ const r=asc/km; return r<8?0:r<14?1:r<20?2:3; }
function climb(s){ return Math.max(0, Math.round((s.eff - s.km)*10)); }
function sparkPts(el,w,h){
  const mx=Math.max.apply(null,el), mn=Math.min.apply(null,el), span=Math.max(mx-mn,120);
  return el.map((z,i)=>(i/(el.length-1)*w).toFixed(1)+","+(h-3-(z-mn)/span*(h-8)).toFixed(1)).join(" ");
}
function sparkSVG(el,w,h){
  if(!el||el.length<2) return "";
  const pts=sparkPts(el,w,h);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="0,${h} ${pts} ${w},${h}" fill="#f0713f" fill-opacity=".16" stroke="none"/><polyline points="${pts}" fill="none" stroke="#f0713f" stroke-width="1.3" vector-effect="non-scaling-stroke"/></svg>`;
}
function profileSVG(t){
  const stops=t.stops;
  if(!stops||!stops.length){
    const el=t.elev||[];
    return sparkSVG(el,360,72)+`<div id="proflbl"><span>▲ ${(el.length?Math.max.apply(null,el):0).toLocaleString()} m</span><span>whole trip</span><span>▼ ${(el.length?Math.min.apply(null,el):0).toLocaleString()} m</span></div>`;
  }
  const W=360,H=72, tot=stops.reduce((a,s)=>a+s.km,0);
  const all=stops.flatMap(s=>s.elev||[]);
  const hi=Math.max.apply(null,all), lo=Math.min.apply(null,all), span=Math.max(hi-lo,150);
  let off=0, pts=[], bands="";
  stops.forEach(s=>{
    const w=s.km/tot*W, sel=day===s.n;
    bands+=`<rect class="pband" data-day="${s.n}" x="${off.toFixed(1)}" y="0" width="${w.toFixed(1)}" height="${H}" fill="${sel?"#f3e2c4":(s.n%2?"#fffdf8":"#f6f1ea")}" style="cursor:pointer"/>`;
    if(w>22) bands+=`<text x="${(off+6).toFixed(1)}" y="${H-8}" font-size="10" fill="#6f675e" font-family="inherit" style="pointer-events:none">${s.n}</text>`;
    (s.elev||[]).forEach((z,i,a)=>{
      const x=off+(i/(Math.max(a.length-1,1)))*w, y=6+(1-(z-lo)/span)*(H-16);
      pts.push(x.toFixed(1)+","+y.toFixed(1));
    });
    off+=w;
  });
  const d=pts.join(" ");
  return `<svg id="prof" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${bands}<polyline points="0,${H} ${d} ${W},${H}" fill="#f0713f" fill-opacity=".18" stroke="none"/><polyline points="${d}" fill="none" stroke="#f0713f" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>
    <div id="proflbl"><span>▲ ${Math.round(hi).toLocaleString()} m</span><span>coloured by day — click a band</span><span>▼ ${Math.round(lo).toLocaleString()} m</span></div>`;
}
function friendHTML(t){
  const s=t.friend; if(!s) return "";
  const col={g:"#97C459",y:"#EF9F27",r:"#E24B4A"};
  const cells=[...s].map(c=>`<div style="flex:1;background:${col[c]}"></div>`).join("");
  return `<div class="block"><h3>Friendliness</h3><div id="strip">${cells}</div>
    <div id="friendleg"><span><i style="background:#97C459"></i>signed / quiet</span><span><i style="background:#EF9F27"></i>minor / mixed</span><span><i style="background:#E24B4A"></i>busy road</span></div></div>`;
}
const TOWNS = [
  {label:"Genève", x:92, y:498},
  {label:"Lausanne", x:148, y:452},
  {label:"Montreux", x:188, y:398},
  {label:"Sion", x:228, y:392},
  {label:"Brig", x:338, y:448},
  {label:"Andermatt", x:478, y:348},
  {label:"Luzern", x:418, y:248},
  {label:"Zürich", x:548, y:128},
  {label:"St. Gallen", x:668, y:88}
];
const TRIPS = [
  {id:"ew", num:"E–W", name:"East–West crossing", kind:"crossing",
   sub:"Müstair → Genève", km:605, asc:4768, daysN:11, eff:1081,
   why:"The whole country, east to west.",
   d:"820,300 620,340 430,140 250,260 140,430 90,470",
   photo:PH.fisterra,
   elev:[1240,1480,1800,2113,1650,1100,720,430,375]},
  {id:"r1", num:"1", name:"Rhône", kind:"route",
   sub:"Andermatt → Genève", km:306, asc:1888, daysN:6, eff:493,
   why:"Glacier source, the Valais, the Lavaux vineyards.",
   d:"455,360 420,400 340,430 190,400 175,410 140,430 90,470",
   photo:PH.furka, friend:"ggggggggggyggggggggg",
   stops:[
     {n:1, name:"Andermatt → Oberwald", km:38, eff:148, x:438, y:380, seg:"455,360 420,400", elev:[1444,1880,2431,2100,1368], photos:[{src:PH.furka,label:"Furka"},{src:PH.gletsch,label:"Gletsch"}]},
     {n:2, name:"Oberwald → Brig", km:44, eff:70, x:380, y:415, seg:"420,400 340,430", elev:[1368,1100,820,670], photos:[{src:PH.gletsch,label:"Rhône valley"}]},
     {n:3, name:"Brig → Sion", km:48, eff:62, x:265, y:418, seg:"340,430 190,400", elev:[670,620,540,490], photos:[{src:PH.lavaux,label:"Valais vines"},{src:PH.lucerne,label:"Sion"}]},
     {n:4, name:"Sion → Aigle", km:41, eff:55, x:200, y:405, seg:"190,400 175,410", elev:[490,530,430,420], photos:[{src:PH.lavaux,label:"Aigle"}]},
     {n:5, name:"Aigle → Lausanne", km:38, eff:58, x:158, y:420, seg:"175,410 140,430", elev:[420,510,450,400], photos:[{src:PH.lavaux,label:"Lavaux"}]},
     {n:6, name:"Lausanne → Genève", km:62, eff:70, x:110, y:450, seg:"140,430 90,470", elev:[400,390,380,375], photos:[{src:PH.lavaux,label:"Lake Geneva"}]}
   ]},
  {id:"r9", num:"9", name:"Lakes", kind:"route",
   sub:"St. Gallen → Montreux", km:362, asc:4490, daysN:8, eff:811,
   why:"Ten lakes, Luzern, Lavaux.",
   d:"620,120 430,140 402,268 320,340 210,380 175,410",
   photo:PH.lucerne,
   elev:[670,820,430,450,800,434,720,375]},
  {id:"r99", num:"99", name:"Heart Route", kind:"route",
   sub:"Rorschach → Lausanne", km:606, asc:9206, daysN:15, eff:1528,
   why:"Quiet hills, the e-bike classic.",
   d:"640,98 560,180 430,220 330,300 210,360 140,430",
   photo:PH.lavaux,
   elev:[400,720,540,980,610,1100,700,900,650,420]},
  {id:"loop3", num:"◆", name:"Three passes loop", kind:"section",
   sub:"Andermatt → Andermatt", km:140, asc:4416, daysN:6, eff:581,
   why:"Susten, Grimsel and Furka in one circuit.",
   d:"455,360 500,320 455,290 400,330 420,400 455,360",
   photo:PH.gletsch,
   elev:[1444,2224,1440,2164,1368,2431,1444]}
];

let mode="network", ride=null, day=null, hover=null, layers={crossing:true, route:true, section:false};

function visible(t){
  if(t.kind==="crossing") return layers.crossing;
  if(t.kind==="route") return layers.route;
  return layers.section;
}
function trip(id){ return TRIPS.find(t=>t.id===id); }

function draw(){
  const gL=document.getElementById("lines"), gB=document.getElementById("badges");
  const gD=document.getElementById("days"), gG=document.getElementById("ghost"), gN=document.getElementById("names");
  [gL,gB,gD,gG,gN].forEach(g=>g.innerHTML="");
  const active = hover || (ride && ride.id);
  TRIPS.forEach(t=>{
    const on = visible(t);
    const isRide = ride && ride.id===t.id;
    const dim = mode!=="network" ? !isRide : (active && t.id!==active);
    const p=document.createElementNS("http://www.w3.org/2000/svg","polyline");
    p.setAttribute("points", t.d);
    p.setAttribute("fill","none");
    p.setAttribute("stroke-linecap","round");
    p.setAttribute("stroke-linejoin","round");
    if(!on && mode==="network"){ p.setAttribute("stroke","#d4c9ba"); p.setAttribute("stroke-width","1.2"); p.setAttribute("opacity",".35"); gG.appendChild(p); return; }
    if(mode!=="network" && !isRide){
      p.setAttribute("stroke","#c4b8a8"); p.setAttribute("stroke-width","1.6"); p.setAttribute("stroke-dasharray","5 6"); p.setAttribute("opacity",".55");
      p.style.cursor="pointer";
      p.addEventListener("click",e=>{ e.stopPropagation(); openRide(t.id); });
      gG.appendChild(p); return;
    }
    const hl = (mode==="network" && t.id===active) || isRide;
    p.setAttribute("stroke", hl ? "#f0713f" : (t.kind==="crossing"?"#8a7f72": t.kind==="section"?"#b8aea0":"#8a7f72"));
    p.setAttribute("stroke-width", hl ? 5.5 : (t.kind==="section"?2:3.2));
    if(t.kind==="crossing" && !hl) p.setAttribute("stroke-dasharray","7 5");
    p.setAttribute("opacity", dim?".3":"1");
    p.style.cursor="pointer";
    p.addEventListener("mouseenter",()=>setHover(t.id));
    p.addEventListener("mouseleave",()=>setHover(null));
    p.addEventListener("click",e=>{
      e.stopPropagation();
      if(isRide) return;
      openRide(t.id);
    });
    gL.appendChild(p);
    if(mode==="network"){
      const pt=t.d.split(" ")[0].split(","), x=+pt[0], y=+pt[1];
      const g=document.createElementNS("http://www.w3.org/2000/svg","g");
      const w=Math.max(22, String(t.num).length*7+12);
      const r=document.createElementNS("http://www.w3.org/2000/svg","rect");
      r.setAttribute("x", x-w/2); r.setAttribute("y", y-10); r.setAttribute("width", w); r.setAttribute("height", 20); r.setAttribute("rx",10);
      r.setAttribute("fill", hl?"#f0713f":"#fffdf8");
      r.setAttribute("stroke", hl?"#f0713f":"#cbbfaf");
      r.setAttribute("stroke-width","1");
      const tx=document.createElementNS("http://www.w3.org/2000/svg","text");
      tx.setAttribute("x",x); tx.setAttribute("y",y+4); tx.setAttribute("text-anchor","middle");
      tx.setAttribute("fill", hl?"#fff":"#1c1916"); tx.setAttribute("font-size","11"); tx.setAttribute("font-weight","700"); tx.setAttribute("font-family","inherit");
      tx.textContent=t.num;
      g.appendChild(r); g.appendChild(tx);
      g.style.cursor="pointer";
      g.addEventListener("mouseenter",()=>setHover(t.id));
      g.addEventListener("click",e=>{ e.stopPropagation(); openRide(t.id); });
      gB.appendChild(g);
    }
  });
  if(mode!=="network" && ride && ride.stops){
    if(day){
      const s=ride.stops.find(x=>x.n===day);
      if(s && s.seg){
        const gold=document.createElementNS("http://www.w3.org/2000/svg","polyline");
        gold.setAttribute("points", s.seg);
        gold.setAttribute("fill","none");
        gold.setAttribute("stroke","#c9a227");
        gold.setAttribute("stroke-width","10");
        gold.setAttribute("stroke-linecap","round");
        gold.setAttribute("stroke-linejoin","round");
        gold.setAttribute("opacity",".92");
        gL.appendChild(gold);
      }
    }
    ride.stops.forEach(s=>{
      const sel=day===s.n;
      const c=document.createElementNS("http://www.w3.org/2000/svg","circle");
      c.setAttribute("cx",s.x); c.setAttribute("cy",s.y); c.setAttribute("r", sel?11:8);
      c.setAttribute("fill", sel?"#c9a227":"#f0713f");
      c.setAttribute("stroke","#fffdf8");
      c.setAttribute("stroke-width","2");
      c.style.cursor="pointer";
      c.addEventListener("click",e=>{ e.stopPropagation(); openDay(s.n); });
      const t=document.createElementNS("http://www.w3.org/2000/svg","text");
      t.setAttribute("x",s.x); t.setAttribute("y",s.y+4); t.setAttribute("text-anchor","middle");
      t.setAttribute("fill", sel?"#1c1916":"#fff"); t.setAttribute("font-size","10"); t.setAttribute("font-weight","700"); t.setAttribute("font-family","inherit");
      t.textContent=s.n; t.style.pointerEvents="none";
      gD.appendChild(c); gD.appendChild(t);
    });
    TOWNS.forEach(n=>{
      const t=document.createElementNS("http://www.w3.org/2000/svg","text");
      t.setAttribute("x", n.x); t.setAttribute("y", n.y);
      t.textContent=n.label;
      gN.appendChild(t);
    });
  }
  sheet();
  pop();
}

function setHover(id){ hover=id; draw(); }
function openRide(id){
  ride=trip(id); mode="ride"; day=null; hover=null;
  location.hash="ride="+id;
  draw();
}
function openDay(n){
  if(!ride) return;
  day = (day===n)?null:n;
  mode = day?"day":"ride";
  location.hash = day ? "ride="+ride.id+"&day="+day : "ride="+ride.id;
  draw();
}
function goNetwork(){ mode="network"; ride=null; day=null; hover=null; location.hash="network"; draw(); }

function sheet(){
  const head=document.getElementById("head");
  const col=document.getElementById("col");
  if(mode==="network"){
    head.innerHTML = `<a class="back" href="switzerland.html">‹ Switzerland by bike</a>
      <p class="kicker">Pick a trip</p>
      <h1>The network</h1>
      <p class="lede">Hover a line or a card. Click to plan the ride. Days are computed after that.</p>
      <div class="chips" id="filters"></div>`;
    const f=document.getElementById("filters");
    [["crossing","crossings"],["route","national routes"],["section","sections / passes"]].forEach(([k,lab])=>{
      const b=document.createElement("button"); b.className="chip"+(layers[k]?" on":""); b.textContent=lab;
      b.onclick=()=>{ layers[k]=!layers[k]; draw(); };
      f.appendChild(b);
    });
    col.innerHTML = `<div id="cards"></div>
      <p class="note">Same cards as the gallery. The map is a reference: coral on hover, click to open the tour sheet.</p>`;
    const box=document.getElementById("cards");
    TRIPS.forEach(t=>{
      if(!visible(t)) return;
      const d=document.createElement("div");
      d.className="tcard"+(hover===t.id?" hl":"");
      d.innerHTML=`<div class="ph" style="background-image:url('${t.photo}')"></div>
        <div class="b"><div class="tn"><span class="badge">${t.num}</span><h2>${t.name}</h2>
        <span class="dl dl${grade(t.km,t.asc)}">${DNAME[grade(t.km,t.asc)]}</span></div>
        <div class="why">${t.why}</div><div class="tm">${t.sub} · ${t.km} km · ${t.asc.toLocaleString()} m · ~${t.daysN} days</div></div>`;
      d.onmouseenter=()=>setHover(t.id);
      d.onmouseleave=()=>setHover(null);
      d.onclick=()=>openRide(t.id);
      box.appendChild(d);
    });
  } else {
    const t=ride;
    const stops=t.stops||[];
    const sel=day && stops.find(s=>s.n===day);
    head.innerHTML = `<button class="back" id="up">‹ All trips on this mock</button>
      <p class="kicker">${day?"Day "+day+" of the ride":"Your tour, planned"}</p>
      <div class="title-row"><h1>${t.name}</h1><span class="badge">${t.num}</span><span class="dl dl${grade(t.km,t.asc)}">${DNAME[grade(t.km,t.asc)]}</span></div>
      <p class="lede">${t.sub} · ${t.why}</p>`;
    document.getElementById("up").onclick=goNetwork;
    col.innerHTML = `
      <div class="stats">
        <div><b>${stops.length||t.daysN}</b><span>days</span></div>
        <div><b>${t.km}</b><span>km</span></div>
        <div><b>${t.asc.toLocaleString()}</b><span>m climbed</span></div>
      </div>
      <div class="block"><h3>Elevation</h3><div id="profwrap">${profileSVG(t)}</div></div>
      ${friendHTML(t)}
      <div class="block"><h3>Days</h3><div id="dayslist"></div></div>
      ${sel?`<div class="block"><h3>On this day</h3>
        ${sparkSVG(sel.elev, 320, 36)}
        <div class="photos">${(sel.photos||[]).map(ph=>`<div><img src="${ph.src}" alt="${ph.label}"><span>${ph.label}</span></div>`).join("")}</div>
        <p class="tm" style="margin-top:10px">Gold on the map is this stretch. Click the day again for the whole ride.</p>
      </div>`:""}
      <p class="note">${day?"The atlas stays a figure — gold marks the day, photos sit here beside it.":"Coral line = the ride. Click a day in the list or on the map. Ghost dashes switch ride."}</p>`;
    col.querySelectorAll(".pband").forEach(r=>{
      r.addEventListener("click",e=>{ e.stopPropagation(); openDay(+r.dataset.day); });
    });
    const box=document.getElementById("dayslist");
    (stops.length?stops:[{n:1,name:t.sub,km:t.km,eff:t.eff,elev:t.elev}]).forEach(s=>{
      const d=document.createElement("div");
      d.className="dayrow"+(day===s.n?" on":"");
      const up=climb(s);
      d.innerHTML=`<span class="n">${s.n}</span>
        <div><div class="name">${s.name}</div><div class="meta">${up?up.toLocaleString()+" m ↑":""}</div></div>
        <div class="km">${s.km} km</div>`;
      d.onclick=()=>openDay(s.n);
      box.appendChild(d);
    });
  }
}
function showPop(x,y,title,sub,cta){
  const pop=document.getElementById("pop"), st=document.getElementById("stage").getBoundingClientRect();
  pop.style.display="block";
  pop.innerHTML=`<b>${title}</b><div class="tm" style="margin:0">${sub||""}</div><div class="cta">${cta||""}</div>`;
  pop.style.left=Math.min(st.width-230, 24+x*(st.width/900))+"px";
  pop.style.top=Math.max(8, y*(st.height/640)-20)+"px";
}
function pop(){
  const pop=document.getElementById("pop");
  if(mode!=="network" || !hover){ pop.style.display="none"; return; }
  const t=trip(hover); if(!t) return;
  const pt=t.d.split(" ")[0].split(",");
  showPop(+pt[0], +pt[1], t.num+" · "+t.name, t.sub+" · "+t.km+" km", "click to plan it ›");
}

document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ if(day){ day=null; mode="ride"; location.hash="ride="+ride.id; draw(); } else if(mode!=="network") goNetwork(); }});

(function start(){
  const h=location.hash.replace("#","");
  const p=Object.fromEntries(h.split("&").filter(Boolean).map(s=>s.split("=")));
  if(p.ride && trip(p.ride)){ ride=trip(p.ride); mode="ride"; if(p.day){ day=+p.day; mode="day"; } }
  else mode="network";
  draw();
})();
</script>
