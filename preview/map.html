<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Map mock — network, ride, day</title>
<style>
:root{
  --paper:#f6f1ea; --ink:#1c1916; --mute:#6f675e; --line:#ddd4c8;
  --route:#f0713f; --gold:#e8b86d; --card:#fffdf8; --land:#e7dfd2; --water:#c5d5de;
  --ghost:#c9c0b6; --route-line:#6d8492; --cross:#8a9aaa;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);
  font:15px/1.45 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
#app{display:grid;grid-template-columns:340px 1fr;height:100%}
#side{overflow:auto;border-right:1px solid var(--line);padding:0 0 28px}
#stage{position:relative;background:#efe8dd;overflow:hidden}
svg{width:100%;height:100%;display:block;cursor:grab}
h1{font-family:Georgia,"Iowan Old Style",serif;font-size:26px;margin:18px 18px 4px;font-weight:600}
.kicker,.sub{margin:0 18px;color:var(--mute);font-size:13px}
.back{display:inline-flex;margin:16px 18px 0;color:#c45a28;font-size:13px;cursor:pointer;border:0;background:none;font:inherit;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 18px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:12px;color:var(--mute);cursor:pointer;font:inherit}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.stats{display:flex;gap:16px;margin:12px 18px 10px}
.stats b{display:block;font-size:20px;font-weight:600}
.stats span{font-size:11px;color:var(--mute)}
.tcard,.day{margin:0 14px 8px;border:1px solid var(--line);background:var(--card);border-radius:12px;cursor:pointer;overflow:hidden}
.tcard{display:grid;grid-template-columns:72px 1fr}
.tcard.hl,.day.on{border-color:var(--route)}
.tcard .ph{background:#cfc4b4 center/cover}
.tcard .b{padding:8px 10px}
.tn{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--ink);color:#fff;font-size:10px;font-weight:700}
.badge.route{background:var(--route)}
.why,.tm{font-size:12px;color:var(--mute);margin:2px 0 0}
.day{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:8px 10px}
.day .n{color:var(--mute);font-size:12px}
.day.on{background:#fff4ec}
.hint{position:absolute;left:14px;bottom:12px;font-size:12px;color:var(--mute);background:rgba(246,241,234,.88);padding:4px 8px;border-radius:6px}
#legend{position:absolute;right:14px;top:12px;display:flex;flex-direction:column;gap:4px}
#legend button{font-size:11px}
#pop{display:none;position:absolute;z-index:5;max-width:240px;background:var(--card);border:1px solid #cbbfaf;border-radius:10px;padding:8px 10px;font-size:13px;box-shadow:0 8px 24px rgba(28,25,22,.12)}
#pop b{display:block} #pop .cta{color:var(--route);margin-top:4px;font-size:12px}
.chip-photo{stroke:#fff;stroke-width:2}
#titlebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.note{margin:14px 18px 0;font-size:12px;color:var(--mute);border-left:3px solid var(--route);padding-left:10px}
@media(max-width:760px){
  #app{grid-template-columns:1fr;grid-template-rows:42vh 1fr}
  #stage{order:0;border-bottom:1px solid var(--line)}#side{order:1;border-right:0}
}
</style>
</head>
<body>
<div id="app">
  <div id="side"></div>
  <div id="stage">
    <svg id="map" viewBox="0 0 900 640" preserveAspectRatio="xMidYMid meet">
      <path id="land" fill="#e7dfd2" stroke="#b7aa98" stroke-width="1.4"
        d="M90,470 C70,420 55,320 80,210 C100,90 180,40 280,50 C400,30 520,55 640,80 C740,70 820,110 850,200 C870,280 840,360 800,400 C760,470 680,540 560,560 C480,600 420,590 380,540 C320,560 220,530 90,470 Z"/>
      <ellipse cx="118" cy="448" rx="52" ry="22" fill="#c5d5de" stroke="#a9bec8" transform="rotate(-18 118 448)"/>
      <ellipse cx="210" cy="300" rx="38" ry="14" fill="#c5d5de" stroke="#a9bec8"/>
      <ellipse cx="402" cy="268" rx="28" ry="16" fill="#c5d5de" stroke="#a9bec8"/>
      <ellipse cx="508" cy="528" rx="22" ry="28" fill="#c5d5de" stroke="#a9bec8"/>
      <ellipse cx="640" cy="98" rx="48" ry="18" fill="#c5d5de" stroke="#a9bec8"/>
      <g id="ghost"></g>
      <g id="lines"></g>
      <g id="days"></g>
      <g id="photos"></g>
      <g id="badges"></g>
    </svg>
    <div id="legend"></div>
    <div id="hint"></div>
    <div id="pop"></div>
  </div>
</div>
<script>
const PH = {
  furka:"img/furka.jpg", lucerne:"img/lucerne.jpg", lavaux:"img/lavaux.jpg",
  gletsch:"img/gletsch.jpg", japan:"img/japan.jpg", fisterra:"img/fisterra.jpg"
};
const TRIPS = [
  {id:"ew", num:"E–W", name:"East–West crossing", kind:"crossing",
   sub:"Müstair → Genève", km:605, asc:4768, days:13,
   why:"The whole country, east to west.",
   d:"820,300 620,340 430,140 250,260 140,430 90,470",
   photo:PH.fisterra},
  {id:"r1", num:"1", name:"Rhône", kind:"route",
   sub:"Andermatt → Genève", km:306, asc:1888, daysN:8,
   why:"Glacier source, the Valais, the Lavaux vineyards.",
   d:"455,360 420,400 340,430 190,400 175,410 140,430 90,470",
   photo:PH.furka,
   stops:[
     {n:1, name:"Andermatt → Oberwald", km:38, x:438, y:380, seg:"455,360 420,400", photos:[{src:PH.furka,label:"Furka"},{src:PH.gletsch,label:"Gletsch"}]},
     {n:2, name:"Oberwald → Brig", km:44, x:380, y:415, seg:"420,400 340,430", photos:[{src:PH.gletsch,label:"Rhône valley"}]},
     {n:3, name:"Brig → Sion", km:48, x:265, y:418, seg:"340,430 190,400", photos:[{src:PH.lavaux,label:"Valais vines"},{src:PH.lucerne,label:"Sion"}]},
     {n:4, name:"Sion → Aigle", km:41, x:200, y:405, seg:"190,400 175,410", photos:[{src:PH.lavaux,label:"Aigle"}]},
     {n:5, name:"Aigle → Lausanne", km:38, x:158, y:420, seg:"175,410 140,430", photos:[{src:PH.lavaux,label:"Lavaux"}]},
     {n:6, name:"Lausanne → Genève", km:62, x:110, y:450, seg:"140,430 90,470", photos:[{src:PH.lavaux,label:"Lake Geneva"}]}
   ]},
  {id:"r9", num:"9", name:"Lakes", kind:"route",
   sub:"St. Gallen → Montreux", km:362, asc:4490, daysN:12,
   why:"Ten lakes, Luzern, Lavaux.",
   d:"620,120 430,140 402,268 320,340 210,380 175,410",
   photo:PH.lucerne},
  {id:"r99", num:"99", name:"Heart Route", kind:"route",
   sub:"Rorschach → Lausanne", km:606, asc:9206, daysN:13,
   why:"Quiet hills, the e-bike classic.",
   d:"640,98 560,180 430,220 330,300 210,360 140,430",
   photo:PH.lavaux},
  {id:"loop3", num:"◆", name:"Three passes loop", kind:"section",
   sub:"Andermatt → Andermatt", km:140, asc:4416, daysN:3,
   why:"Susten, Grimsel and Furka in one circuit.",
   d:"455,360 500,320 455,290 400,330 420,400 455,360",
   photo:PH.gletsch}
];

let mode="network", ride=null, day=null, hover=null, layers={crossing:true, route:true, section:true};

function visible(t){
  if(t.kind==="crossing") return layers.crossing;
  if(t.kind==="route") return layers.route;
  return layers.section;
}
function trip(id){ return TRIPS.find(t=>t.id===id); }

function draw(){
  const gL=document.getElementById("lines"), gB=document.getElementById("badges");
  const gD=document.getElementById("days"), gP=document.getElementById("photos"), gG=document.getElementById("ghost");
  [gL,gB,gD,gP,gG].forEach(g=>g.innerHTML="");
  const show = TRIPS.filter(visible);
  const active = hover || (ride && ride.id);
  TRIPS.forEach(t=>{
    const on = visible(t);
    const isRide = ride && ride.id===t.id;
    const dim = mode!=="network" ? !isRide : (active && t.id!==active);
    const p=document.createElementNS("http://www.w3.org/2000/svg","polyline");
    p.setAttribute("points", t.d);
    p.setAttribute("fill","none");
    p.setAttribute("stroke-linecap","round");
    p.setAttribute("stroke-linejoin","round");
    if(!on && mode==="network"){ p.setAttribute("stroke","#ddd6cc"); p.setAttribute("stroke-width","1.2"); p.setAttribute("opacity",".35"); gG.appendChild(p); return; }
    if(mode!=="network" && !isRide){
      p.setAttribute("stroke","#c9c0b6"); p.setAttribute("stroke-width","1.4"); p.setAttribute("stroke-dasharray","4 5"); p.setAttribute("opacity",".55");
      p.style.cursor="pointer";
      p.addEventListener("click",e=>{ e.stopPropagation(); openRide(t.id); });
      gG.appendChild(p); return;
    }
    const hl = (mode==="network" && t.id===active) || isRide;
    const rideQuiet = isRide && mode==="day";
    p.setAttribute("stroke", hl ? "#f0713f" : (t.kind==="crossing"?"#8a9aaa": t.kind==="section"?"#9aa3a8":"#6d8492"));
    p.setAttribute("stroke-width", hl ? (rideQuiet?3.4:5) : (t.kind==="section"?2:3.2));
    if(t.kind==="crossing" && !hl) p.setAttribute("stroke-dasharray","7 5");
    p.setAttribute("opacity", dim?".28": (rideQuiet?".55":"1"));
    p.style.cursor="pointer";
    p.dataset.id=t.id;
    p.addEventListener("mouseenter",()=>setHover(t.id));
    p.addEventListener("mouseleave",()=>setHover(null));
    p.addEventListener("click",e=>{
      e.stopPropagation();
      if(isRide){ if(mode==="day") openDay(day); return; }
      openRide(t.id);
    });
    gL.appendChild(p);
    if(mode==="network" || isRide){
      const pt=t.d.split(" ")[0].split(","), x=+pt[0], y=+pt[1];
      const g=document.createElementNS("http://www.w3.org/2000/svg","g");
      const w=Math.max(22, String(t.num).length*7+12);
      const r=document.createElementNS("http://www.w3.org/2000/svg","rect");
      r.setAttribute("x", x-w/2); r.setAttribute("y", y-10); r.setAttribute("width", w); r.setAttribute("height", 20); r.setAttribute("rx",10);
      r.setAttribute("fill", hl?"#f0713f":"#1c1916");
      const tx=document.createElementNS("http://www.w3.org/2000/svg","text");
      tx.setAttribute("x",x); tx.setAttribute("y",y+4); tx.setAttribute("text-anchor","middle");
      tx.setAttribute("fill","#fff"); tx.setAttribute("font-size","11"); tx.setAttribute("font-weight","700"); tx.setAttribute("font-family","inherit");
      tx.textContent=t.num;
      g.appendChild(r); g.appendChild(tx);
      g.style.cursor="pointer";
      g.addEventListener("mouseenter",()=>setHover(t.id));
      g.addEventListener("click",e=>{ e.stopPropagation(); openRide(t.id); });
      gB.appendChild(g);
    }
  });
  if(mode!=="network" && ride && ride.stops){
    if(day){
      const s=ride.stops.find(x=>x.n===day);
      if(s && s.seg){
        const gold=document.createElementNS("http://www.w3.org/2000/svg","polyline");
        gold.setAttribute("points", s.seg);
        gold.setAttribute("fill","none");
        gold.setAttribute("stroke","#e8b86d");
        gold.setAttribute("stroke-width","10");
        gold.setAttribute("stroke-linecap","round");
        gold.setAttribute("stroke-linejoin","round");
        gold.setAttribute("opacity",".92");
        gL.appendChild(gold);
      }
    }
    ride.stops.forEach(s=>{
      const c=document.createElementNS("http://www.w3.org/2000/svg","circle");
      c.setAttribute("cx",s.x); c.setAttribute("cy",s.y); c.setAttribute("r", day===s.n?10:7);
      c.setAttribute("fill", day===s.n?"#e8b86d":"#fff");
      c.setAttribute("stroke", day===s.n?"#1c1916":"#f0713f");
      c.setAttribute("stroke-width","2");
      c.style.cursor="pointer";
      c.addEventListener("click",e=>{ e.stopPropagation(); openDay(s.n); });
      const t=document.createElementNS("http://www.w3.org/2000/svg","text");
      t.setAttribute("x",s.x); t.setAttribute("y",s.y+4); t.setAttribute("text-anchor","middle");
      t.setAttribute("fill","#1c1916"); t.setAttribute("font-size","9"); t.setAttribute("font-weight","700"); t.setAttribute("font-family","inherit");
      t.textContent=s.n; t.style.pointerEvents="none";
      gD.appendChild(c); gD.appendChild(t);
    });
    if(day){
      const s=ride.stops.find(x=>x.n===day);
      if(s){
        (s.photos||[]).forEach((ph,i)=>{
          const x=s.x+22+i*56, y=s.y-42;
          const img=document.createElementNS("http://www.w3.org/2000/svg","image");
          img.setAttributeNS("http://www.w3.org/1999/xlink","href", ph.src);
          img.setAttribute("href", ph.src);
          img.setAttribute("x",x); img.setAttribute("y",y); img.setAttribute("width",48); img.setAttribute("height",36);
          img.setAttribute("preserveAspectRatio","xMidYMid slice");
          const rr=document.createElementNS("http://www.w3.org/2000/svg","rect");
          rr.setAttribute("x",x-1); rr.setAttribute("y",y-1); rr.setAttribute("width",50); rr.setAttribute("height",38); rr.setAttribute("rx",6);
          rr.setAttribute("fill","#fff"); rr.setAttribute("stroke","#1c1916"); rr.setAttribute("stroke-width",".6");
          gP.appendChild(rr); gP.appendChild(img);
          img.addEventListener("click",e=>{ e.stopPropagation(); showPop(x+24,y, ph.label, "on this day’s stretch"); });
        });
      }
    }
  }
  setView();
  side();
  hint();
  pop();
}

function setView(){
  const svg=document.getElementById("map");
  if(mode==="day" && ride && ride.stops){
    const s=ride.stops.find(x=>x.n===day);
    const pts=(s.seg||(s.x+","+s.y)).split(" ").map(p=>p.split(",").map(Number));
    const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
    const minX=Math.min(...xs), maxX=Math.max(...xs);
    const minY=Math.min(...ys), maxY=Math.max(...ys);
    const pad=120;
    const w=Math.max(320, maxX-minX+pad*2);
    const h=Math.max(240, maxY-minY+pad*2);
    svg.setAttribute("viewBox", `${(minX+maxX)/2-w/2} ${(minY+maxY)/2-h/2} ${w} ${h}`);
  } else {
    svg.setAttribute("viewBox","0 0 900 640");
  }
}

function setHover(id){ hover=id; draw(); }
function openRide(id){
  ride=trip(id); mode="ride"; day=null; hover=null;
  location.hash="ride="+id;
  draw();
}
function openDay(n){
  if(!ride) return;
  day = (day===n)?null:n;
  mode = day?"day":"ride";
  location.hash = day ? "ride="+ride.id+"&day="+day : "ride="+ride.id;
  draw();
}
function goNetwork(){ mode="network"; ride=null; day=null; hover=null; location.hash="network"; draw(); }

function side(){
  const el=document.getElementById("side");
  if(mode==="network"){
    el.innerHTML = `<a class="back" href="hub.html">‹ Where to ride</a>
      <h1>Switzerland by bike</h1>
      <p class="sub">Hover a line or a card. Click to make it the ride. Days are computed after that.</p>
      <div class="chips" id="filters"></div>
      <p class="kicker" style="margin-top:8px">Trips · ${TRIPS.filter(visible).length}</p>
      <div id="cards"></div>
      <p class="note">Mock of the map model — not the live planner. Crossings dashed, numbered routes solid, sections quieter.</p>`;
    const f=document.getElementById("filters");
    [["crossing","crossings"],["route","national routes"],["section","sections / passes"]].forEach(([k,lab])=>{
      const b=document.createElement("button"); b.className="chip"+(layers[k]?" on":""); b.textContent=lab;
      b.onclick=()=>{ layers[k]=!layers[k]; draw(); };
      f.appendChild(b);
    });
    const box=document.getElementById("cards");
    TRIPS.forEach(t=>{
      if(!visible(t)) return;
      const d=document.createElement("div");
      d.className="tcard"+(hover===t.id?" hl":"");
      d.innerHTML=`<div class="ph" style="background-image:url('${t.photo}')"></div>
        <div class="b"><div class="tn"><span class="badge ${t.kind==="route"?"route":""}">${t.num}</span>${t.name}</div>
        <div class="why">${t.why}</div><div class="tm">${t.sub} · ${t.km} km</div></div>`;
      d.onmouseenter=()=>setHover(t.id);
      d.onmouseleave=()=>setHover(null);
      d.onclick=()=>openRide(t.id);
      box.appendChild(d);
    });
  } else {
    const t=ride;
    const stops=t.stops||[];
    el.innerHTML = `<button class="back" id="up">‹ All 5 trips on this mock</button>
      <h1 id="titlebar"><span class="badge route">${t.num}</span> ${t.name}</h1>
      <p class="sub">${t.sub} · ${t.why}</p>
      <div class="stats"><div><b>${stops.length||t.daysN}</b><span>days</span></div><div><b>${t.km}</b><span>km</span></div><div><b>${t.asc.toLocaleString()}</b><span>m climbed</span></div></div>
      <p class="kicker">Days — click one to zoom that stretch</p>
      <div id="dayslist"></div>
      ${day?`<button class="back" id="whole" style="margin-top:8px">Whole trip</button>`:""}
      <p class="note">${day?"Day "+day+" is the section: the map zooms, gold on that stretch, photo chips on the line.":"The coral line is the ride. Ghost dashes are other trips you could switch to."}</p>`;
    document.getElementById("up").onclick=goNetwork;
    const whole=document.getElementById("whole");
    if(whole) whole.onclick=()=>openDay(day);
    const box=document.getElementById("dayslist");
    (stops.length?stops:[{n:1,name:t.sub,km:t.km}]).forEach(s=>{
      const d=document.createElement("div");
      d.className="day"+(day===s.n?" on":"");
      d.innerHTML=`<div class="n">${s.n}</div><div>${s.name}</div><div class="n">${s.km} km</div>`;
      d.onclick=()=>openDay(s.n);
      box.appendChild(d);
    });
  }
  const lg=document.getElementById("legend");
  lg.innerHTML="";
  if(mode==="network"){
    [["crossing","crossings"],["route","routes"],["section","sections"]].forEach(([k,lab])=>{
      const b=document.createElement("button"); b.className="chip"+(layers[k]?" on":""); b.textContent=lab;
      b.onclick=()=>{ layers[k]=!layers[k]; draw(); }; lg.appendChild(b);
    });
  }
}
function hint(){
  document.getElementById("hint").textContent =
    mode==="network" ? "Hover a line to isolate it · click it (or its card) to ride it" :
    mode==="day" ? "Photo chips are sights on this day · click the day again for the whole ride" :
    "Click a numbered day to zoom that section · ghost lines switch ride";
}
function showPop(x,y,title,sub){
  const pop=document.getElementById("pop"), st=document.getElementById("stage").getBoundingClientRect(), svg=document.getElementById("map").getBoundingClientRect();
  pop.style.display="block";
  pop.innerHTML=`<b>${title}</b><div class="sub" style="margin:0">${sub||""}</div><div class="cta">on the line ›</div>`;
  pop.style.left=Math.min(st.width-250, 40+x*(svg.width/900))+"px";
  pop.style.top=Math.max(8, y*(svg.height/640)-20)+"px";
}
function pop(){
  const pop=document.getElementById("pop");
  if(mode!=="network" || !hover){ if(mode!=="day") pop.style.display="none"; return; }
  const t=trip(hover); if(!t) return;
  const pt=t.d.split(" ")[0].split(",");
  showPop(+pt[0], +pt[1], t.num+" · "+t.name, t.sub+" · "+t.km+" km");
  pop.querySelector(".cta").textContent="click to ride it ›";
}

document.getElementById("map").addEventListener("click",()=>{
  if(mode==="day"){ openDay(day); }
  else if(mode==="ride") goNetwork();
  else setHover(null);
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ if(day){ day=null; mode="ride"; location.hash="ride="+ride.id; draw(); } else if(mode!=="network") goNetwork(); }});

(function start(){
  const h=location.hash.replace("#","");
  const p=Object.fromEntries(h.split("&").filter(Boolean).map(s=>s.split("=")));
  if(p.ride && trip(p.ride)){ ride=trip(p.ride); mode="ride"; if(p.day){ day=+p.day; mode="day"; } }
  else mode="network";
  draw();
})();
</script>
</body>
</html>
