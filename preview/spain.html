<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Across Spain</title>
<link rel="stylesheet" href="paper.css?v=13">
</head>
<body>
<header id="head"></header>
<main>
  <div class="split">
    <div id="col"></div>
    <aside class="mapcard" id="stage">
      <button type="button" id="mapback" hidden>‹ All trips</button>
      <div id="maptools" hidden>
        <div class="zoompair">
          <button type="button" id="zout" title="Zoom out">−</button>
          <button type="button" id="zin" title="Zoom in">+</button>
        </div>
        <button type="button" id="vehbtn" title="Switch vehicle">Bicycle</button>
        <button type="button" id="langbtn" title="Place names">English names</button>
        <button type="button" id="fitbtn" title="Show the whole trip">Whole trip</button>
      </div>
      <svg id="map" viewBox="0 0 900 640" preserveAspectRatio="xMidYMid meet">
        <g id="land"></g>
        <g id="water"></g>
        <g id="ghost"></g>
        <g id="lines"></g>
        <g id="ride"></g>
        <g id="gold"></g>
        <g id="fac"></g>
        <g id="towns"></g>
        <g id="discs"></g>
        <g id="badges"></g>
      </svg>
      <div id="maplayers" hidden>
        <button type="button" data-l="shop" title="Shops"><svg viewBox="0 0 20 20"><path d="M3 7h14l-1.2 9.5H4.2z"/><path d="M7 7V5a3 3 0 0 1 6 0v2"/></svg></button>
        <button type="button" data-l="stay" title="Beds"><svg viewBox="0 0 20 20"><path d="M2 15V8h16v7"/><path d="M2 12h16"/><path d="M4 8V5h5v3"/></svg></button>
        <button type="button" data-l="bath" title="Baths and hot springs"><svg viewBox="0 0 20 20"><path d="M3 10h14v2a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z"/><path d="M5 10V5a2 2 0 0 1 4 0"/></svg></button>
        <button type="button" data-l="rail" title="Stations"><svg viewBox="0 0 20 20"><rect x="4" y="3" width="12" height="11" rx="2.5"/><path d="M4 9h12M7 17l1-3M13 17l-1-3"/><circle cx="7.5" cy="11.5" r=".6"/><circle cx="12.5" cy="11.5" r=".6"/></svg></button>
        <button type="button" data-l="water" title="Drinking water"><svg viewBox="0 0 20 20"><path d="M10 3c3 4 5 6.5 5 9a5 5 0 0 1-10 0c0-2.5 2-5 5-9z"/></svg></button>
      </div>
      <svg id="minimap" hidden viewBox="0 0 180 120" preserveAspectRatio="xMidYMid meet" role="button" title="All days" aria-label="Show the whole trip"></svg>
      <a id="pop" target="_self"></a>
    </aside>
  </div>
</main>
<footer></footer>
<script>
window.PAPER={
  id:"spain",
  title:"Across Spain",
  country:"Spain",
  localLabel:"nombres locales",
  kicker:n=>"Spain · "+n+" trips",
  lede:"Cap de Creus to Fisterra, or the caminos: Francés, Norte, Invierno, and on to the cape. Scroll the atlas or use the arrows to walk the list. Open a tour when you are ready. Days are computed from effort.",
  note:"Eight trips from the live catalogue. Snapshots of the Spain graph, not the whole graph in this repo. This page is the product, not a doorway to the dark planner.",
  footer:"Spain · 8 trips. Photos Wikimedia Commons. Days are computed, not stored.",
  backAll:n=>"‹ All "+n+" trips",
  tripsUrl:"data/spain-trips.json",
  landUrl:"data/spain_outline.geojson",
  waterUrl:"data/spain_water.geojson",
  atlasUrl:null,
  ridesUrl:"data/rides/spain/",
  photosUrl:"data/photos.json",
  landFilter:"Spain (mainland)",
  landMode:"fill",
  bbox:{lon0:-9.55, lon1:3.55, lat0:40.95, lat1:43.85},
  photos:{
    ew:"img/creus.jpg", frances:"img/santiago.jpg", norte:"img/sansebastian.jpg",
    invierno:"img/ponferrada.jpg", fisterra:"img/fisterra.jpg",
    pyrenees:"img/pyrenees.jpg", ebro:"img/girona.jpg", barcelona:"img/barcelona.jpg"
  },
  places:{
    "Santiago de Compostela":["img/santiago.jpg"],
    Fisterra:["img/fisterra.jpg"],
    "Santiago":["img/santiago.jpg"],
    Girona:["img/girona.jpg"],
    Barcelona:["img/barcelona.jpg"],
    León:["img/santiago.jpg"],
    Burgos:["img/santiago.jpg"],
    Zaragoza:["img/girona.jpg"],
    "San Sebastián":["img/sansebastian.jpg"],
    "Donostia":["img/sansebastian.jpg"]
  },
  en:{"Donostia":"San Sebastián","A Coruña":"Corunna","Girona":"Gerona"},
  photoFallback:"img/fisterra.jpg"
};
</script>
<script src="paper.js?v=13"></script>
</body>
</html>
