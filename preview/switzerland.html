<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Switzerland by bike</title>
<style>
:root{
  --paper:#f6f1ea; --ink:#1c1916; --mute:#6f675e; --line:#ddd4c8;
  --route:#f0713f; --gold:#c9a227; --card:#fffdf8;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font:16px/1.5 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
html.planner,body.planner{height:100%;overflow:hidden}
header{padding:22px 24px 0;max-width:1120px;margin:0 auto}
a.back,button.back{font-size:13px;color:var(--mute);text-decoration:none;border:0;background:none;font:inherit;cursor:pointer;padding:0}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:10px 0 8px}
h1{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;font-weight:600;
  font-size:clamp(28px,4vw,40px);letter-spacing:-.02em;margin:0 0 6px;line-height:1.1}
.lede{color:var(--mute);margin:0 0 16px;max-width:42em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--mute);cursor:pointer;font:inherit;background:transparent}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
main{max-width:1120px;margin:0 auto;padding:0 24px 56px}
.split{display:grid;grid-template-columns:minmax(280px,400px) 1fr;gap:22px;align-items:start}
.tcard{display:grid;grid-template-columns:120px 1fr;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;margin:0 0 10px;text-decoration:none;color:inherit}
.tcard.hl{border-color:var(--route)}
.tcard .ph{background:#cfc4b4 center/cover no-repeat;min-height:96px}
.tcard .b{padding:10px 12px}
.tn{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tn h2{font-family:Georgia,serif;font-size:17px;margin:0;font-weight:600}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--route);color:#fff;font-size:11px;font-weight:700}
.why{font-size:13px;color:#3f3a34;margin:4px 0 0}
.tm{font-size:12px;color:var(--mute);margin-top:6px}
.dl{font-size:10px;font-weight:600;border:1px solid;border-radius:9px;padding:1px 6px;white-space:nowrap}
.dl0{color:#3d6b1e;border-color:#97C459}
.dl1{color:#8a5a10;border-color:#EF9F27}
.dl2{color:#c45a28;border-color:#f07d3f}
.dl3{color:#a32d2c;border-color:#E24B4A}
.top{font-size:10px;font-weight:600;color:#8a6a12;border:1px solid #d9c27a;border-radius:9px;padding:1px 6px}
.stats{display:flex;gap:28px;margin:16px 0 20px}
.stats b{display:block;font-family:Georgia,serif;font-size:28px;font-weight:600;line-height:1.1}
.stats span{font-size:12px;color:var(--mute)}
.plan{display:inline-block;margin-top:8px;color:var(--route);font-size:14px;text-decoration:none}
.stats4{display:flex;flex-wrap:wrap;gap:22px;margin:16px 0 14px}
.stats4 b{display:block;font-family:Georgia,serif;font-size:28px;font-weight:600;line-height:1.1}
.stats4 span{font-size:12px;color:var(--mute)}
.profwrap{margin:8px 0 10px;position:relative}
.profwrap svg{width:100%;height:72px;display:block;background:#efe8dc;border-radius:8px}
.profhi,.proflo{position:absolute;right:8px;font-size:10px;color:var(--mute)}
.profhi{top:4px}.proflo{bottom:4px}
.strip{display:flex;height:10px;border-radius:6px;overflow:hidden;margin:8px 0 6px}
.strip i{display:block;min-width:2px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--mute);margin:0 0 14px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.fold{border-top:1px solid var(--line);padding:8px 0;flex:0 0 auto}
.foldhead{display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-size:13px;color:var(--mute);background:none;border:0;font:inherit;width:100%;padding:0;gap:8px}
.foldhead b{font-weight:600;color:var(--ink)}
.foldhead span{font-size:12px;color:var(--mute);text-align:right}
.fold.closed .foldbody{display:none}
.ends{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 6px}
.ends label{font-size:11px;color:var(--mute);display:flex;flex-direction:column;gap:3px}
.ends select{font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--card);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.opt{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;background:transparent;font:inherit;cursor:pointer;color:var(--ink)}
.opt.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.effort{width:100%;accent-color:var(--route)}
.dlist{margin:6px 0 0;padding:0;list-style:none}
.day{display:grid;grid-template-columns:22px 1fr auto;gap:6px;align-items:center;padding:5px 4px;border-radius:8px;cursor:pointer}
.day:hover,.day.sel{background:#fff}
.day .n{width:20px;height:20px;border-radius:10px;background:var(--route);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.day.sel .n{background:var(--gold)}
.day .who{font-size:12.5px}
.day .meta{font-size:11px;color:var(--mute)}
.day .extra{grid-column:2/-1;margin-top:2px}
.day .phs{display:flex;gap:6px;margin-top:6px}
.day .phs div{width:72px;height:48px;background:#cfc4b4 center/cover no-repeat;border-radius:6px;flex:0 0 auto}
.spark{width:100%;height:22px;display:block;margin-top:4px}
.export{flex:0 0 auto;margin-top:auto;padding:10px 0 0;border-top:1px solid var(--line)}
.export .row{margin:0}
.export .ghost{margin:6px 0 0}
.ghost{font-size:12px;color:var(--mute)}
.townlab{font-size:9px;fill:#1c1916;font-family:inherit}
.mapcard{background:#efe8dc;border:1px solid var(--line);border-radius:16px;overflow:hidden;position:sticky;top:16px;height:calc(100vh - 48px);min-height:520px}
.mapcard svg{width:100%;height:100%;display:block;overflow:hidden}
#mapback[hidden],#maptools[hidden]{display:none!important}
#mapback,#maptools{position:absolute;z-index:6;top:12px}
#mapback{left:12px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:12px/1 inherit;color:var(--ink);cursor:pointer;box-shadow:0 1px 6px rgba(28,25,22,.08)}
#maptools{right:12px;display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:72%}
#maptools button{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font:12px/1 inherit;color:var(--ink);cursor:pointer;box-shadow:0 1px 6px rgba(28,25,22,.08)}
.zoompair{display:flex}
.zoompair button{border-radius:0;padding:6px 10px}
.zoompair button:first-child{border-radius:999px 0 0 999px}
.zoompair button:last-child{border-radius:0 999px 999px 0;margin-left:-1px}
#pop{display:none;position:absolute;z-index:5;max-width:240px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;box-shadow:0 4px 16px rgba(28,25,22,.12);text-decoration:none;color:inherit;cursor:pointer}
#pop:hover{border-color:var(--route)}
#pop b{display:block}
#pop .cta{color:var(--route);margin-top:4px;font-size:12px}
.note{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);color:var(--mute);font-size:13px}
footer{max-width:1120px;margin:0 auto;padding:0 24px 40px;color:var(--mute);font-size:13px}
body.planner header,body.planner footer{display:none}
body.planner main{max-width:none;padding:12px 16px;height:100vh}
body.planner .split{height:100%;grid-template-columns:minmax(280px,340px) 1fr;gap:14px}
#col.sheet{display:flex;flex-direction:column;height:100%;min-height:0;overflow:hidden}
body.planner .sheet-top{flex:0 0 auto}
body.planner .stats4{gap:16px;margin:8px 0 6px}
body.planner .stats4 b{font-size:22px}
body.planner .profwrap svg{height:56px}
body.planner .legend{margin:0 0 6px;font-size:10px}
body.planner .mapcard{position:relative;top:0;height:100%;min-height:0}
body.planner .fold.grow:not(.closed){flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding-bottom:0}
body.planner .tn h2{font-size:22px}
body.planner .fold.grow:not(.closed) .foldbody{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
@media(max-width:860px){
  .split{grid-template-columns:1fr}
  .mapcard{position:relative;top:0;height:42vh;min-height:280px;order:-1}
  html.planner,body.planner{height:auto;overflow:auto}
  body.planner main{height:auto}
  #col.sheet{height:auto;overflow:visible}
  body.planner .fold.grow:not(.closed) .foldbody{overflow:visible}
}
@media print{
  html,body{height:auto;overflow:visible;background:#fff}
  header,footer,#mapback,#maptools,.export,.chips{display:none!important}
  body.planner main{height:auto;padding:0}
  .split{display:block}
  .mapcard{height:420px;position:relative;break-inside:avoid}
  #col.sheet{height:auto;overflow:visible}
}
</style>
</head>
<body>
<header id="head"></header>
<main>
  <div class="split">
    <div id="col"></div>
    <aside class="mapcard" id="stage">
      <button type="button" id="mapback" hidden>‹ All 29 trips</button>
      <div id="maptools" hidden>
        <div class="zoompair">
          <button type="button" id="zout" title="Zoom out">−</button>
          <button type="button" id="zin" title="Zoom in">+</button>
        </div>
        <button type="button" id="vehbtn" title="Switch vehicle">Bicycle</button>
        <button type="button" id="langbtn" title="Place names">English names</button>
        <button type="button" id="fitbtn" title="Show the whole trip">Whole trip</button>
      </div>
      <svg id="map" viewBox="0 0 900 640" preserveAspectRatio="xMidYMid meet">
        <g id="land"></g>
        <g id="water"></g>
        <g id="ghost"></g>
        <g id="lines"></g>
        <g id="gold"></g>
        <g id="towns"></g>
        <g id="discs"></g>
        <g id="badges"></g>
      </svg>
      <a id="pop" target="_self"></a>
    </aside>
  </div>
</main>
<footer>Switzerland first — 29 trips from the live catalogue. Photos Wikimedia Commons. Days are computed, not stored.</footer>
<script>
const DNAME=["easy","moderate","hard","very hard"];
function grade(km,asc){ if(!km) return 0; const r=asc/km; return r<8?0:r<14?1:r<20?2:3; }
function topLabel(n){ if(n<=5) return "Top 5"; if(n<=10) return "Top 10"; if(n<=15) return "Top 15"; return "Top "+n; }
function tripHref(t){ return "#trip="+t.id; }

const PHOTO = {
  r1:"img/furka.jpg", r9:"img/lucerne.jpg", r99:"img/lavaux.jpg", loop3:"img/gletsch.jpg",
  r2:"img/rheinfall.jpg", r4:"img/jaun.jpg", r5:"img/aare.jpg", r6:"img/engadin.jpg",
  r7:"img/jura.jpg", r8:"img/aare.jpg", ns:"img/basel.jpg", ew:"img/furka.jpg",
  furka:"img/furka.jpg", grimsel:"img/gletsch.jpg", susten:"img/gletsch.jpg", oberalp:"img/gletsch.jpg",
  klausen:"img/klausen.jpg", gotthard:"img/gotthard.jpg", sanbernardino:"img/gotthard.jpg",
  loetschberg:"img/gletsch.jpg", boatgotthard:"img/lucerne.jpg", alpine:"img/jaun.jpg",
  prealps:"img/lucerne.jpg", bodensee:"img/constance.jpg", leman:"img/chillon.jpg",
  dreiseen:"img/murten.jpg", gotthardx:"img/gotthard.jpg", ticino:"img/lugano.jpg",
  loopfng:"img/gletsch.jpg"
};
function photo(t){
  if(PHOTO[t.id]) return PHOTO[t.id];
  const tags=t.tags||[];
  if(tags.includes("lakes")) return "img/lucerne.jpg";
  if(tags.includes("pass")||tags.includes("alpine")) return "img/gletsch.jpg";
  return "img/furka.jpg";
}

const W=900, H=640, PAD=28;
const BBOX={lon0:5.85, lon1:10.55, lat0:45.78, lat1:47.88};
function xy(lat, lon){
  const x=PAD+(lon-BBOX.lon0)/(BBOX.lon1-BBOX.lon0)*(W-PAD*2);
  const y=PAD+(BBOX.lat1-lat)/(BBOX.lat1-BBOX.lat0)*(H-PAD*2);
  return [x,y];
}
function ringPath(ring){
  return ring.map((c,i)=>{ const p=xy(c[1], c[0]); return (i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1); }).join(" ")+" Z";
}
function linePts(line){
  return (line||[]).map(p=>{ const q=xy(p[0], p[1]); return q[0].toFixed(1)+","+q[1].toFixed(1); }).join(" ");
}

const EN={"Genève":"Geneva","Luzern":"Lucerne","Basel":"Basle","Bern":"Berne","Sankt Gallen":"St. Gallen"};
const VEH_ORDER=["bike","ebike","opium"];
const VEH_LABEL={bike:"Bicycle",ebike:"E-bike",opium:"45 km/h"};
const VB0="0 0 900 640";

let TRIPS=[], mode="network", ride=null, hover=null, filter="top";
let PLAN=null, effort=100, veh="bike", selDay=null;
let lang="local", zoom=1, startId=null, endId=null;
let folds={plan:true, route:false, days:true};

function geo(t){ return t.geo||{}; }
function matches(t){
  const g=geo(t), n=g.n||0, tags=t.tags||[];
  if(filter==="top") return t.top>0;
  if(filter==="all") return true;
  if(filter==="d3") return n>0 && n<=3;
  if(filter==="d46"||filter==="d6") return n>=4 && n<=6;
  if(filter==="d7") return n>=7;
  if(filter==="e0"||filter==="easy") return grade(g.km, g.asc)===0;
  if(filter==="e1") return grade(g.km, g.asc)===1;
  if(filter==="e2") return grade(g.km, g.asc)>=2;
  return tags.includes(filter);
}
function filterChips(){
  const tags=[...new Set(TRIPS.flatMap(t=>t.tags||[]))].sort();
  return [
    ["top","top"],["all","all "+TRIPS.length],
    ["d3","up to 3 days"],["d46","4–6 days"],["d7","7+ days"],
    ["e0","easy"],["e1","moderate"],["e2","hard"],
    ...tags.map(t=>[t,t])
  ];
}
function visible(){ return TRIPS.filter(matches); }

function drawBase(land, water){
  const gL=document.getElementById("land"), gW=document.getElementById("water");
  gL.innerHTML=""; gW.innerHTML="";
  (land.features||[]).forEach(f=>{
    if((f.properties||{}).name!=="Switzerland") return;
    const geom=f.geometry;
    const rings=geom.type==="Polygon"?[geom.coordinates]:geom.coordinates;
    rings.forEach(poly=>{
      const p=document.createElementNS("http://www.w3.org/2000/svg","path");
      p.setAttribute("d", ringPath(poly[0]));
      p.setAttribute("fill","#e7dfd2");
      p.setAttribute("stroke","#cbbfaf");
      p.setAttribute("stroke-width","1.2");
      gL.appendChild(p);
    });
  });
  (water.features||[]).forEach(f=>{
    const kind=(f.properties||{}).kind;
    const geom=f.geometry;
    if(kind==="lake" || geom.type==="Polygon" || geom.type==="MultiPolygon"){
      const polys=geom.type==="Polygon"?[geom.coordinates]:(geom.type==="MultiPolygon"?geom.coordinates:[]);
      polys.forEach(poly=>{
        const p=document.createElementNS("http://www.w3.org/2000/svg","path");
        p.setAttribute("d", ringPath(poly[0]));
        p.setAttribute("fill","#c5d5de");
        p.setAttribute("stroke","#a8c0cc");
        p.setAttribute("stroke-width","0.6");
        gW.appendChild(p);
      });
    } else if(geom.type==="LineString"){
      const pts=geom.coordinates.map(c=>{ const q=xy(c[1],c[0]); return q[0].toFixed(1)+","+q[1].toFixed(1); }).join(" ");
      const p=document.createElementNS("http://www.w3.org/2000/svg","polyline");
      p.setAttribute("points", pts);
      p.setAttribute("fill","none");
      p.setAttribute("stroke","#a8c0cc");
      p.setAttribute("stroke-width","1.1");
      gW.appendChild(p);
    }
  });
}

function mkPoly(pts){
  const p=document.createElementNS("http://www.w3.org/2000/svg","polyline");
  p.setAttribute("points", pts);
  p.setAttribute("fill","none");
  p.setAttribute("stroke-linecap","round");
  p.setAttribute("stroke-linejoin","round");
  return p;
}
function linkWrap(t){
  const a=document.createElementNS("http://www.w3.org/2000/svg","a");
  const url=tripHref(t);
  a.setAttribute("href", url);
  a.setAttributeNS("http://www.w3.org/1999/xlink","href", url);
  a.setAttribute("data-id", t.id);
  a.style.cursor="pointer";
  a.addEventListener("mouseenter",()=>setHover(t.id));
  a.addEventListener("mouseleave",()=>setHover(null));
  return a;
}
function addTrip(t, dest, role){
  const line=geo(t).line; if(!line||line.length<2) return;
  const pts=linePts(line);
  const a=linkWrap(t);
  a.setAttribute("data-role", role);
  const hit=mkPoly(pts);
  hit.setAttribute("stroke","rgba(0,0,0,0.01)");
  hit.setAttribute("stroke-width","16");
  hit.setAttribute("pointer-events","stroke");
  const vis=mkPoly(pts);
  vis.setAttribute("data-vis","1");
  vis.setAttribute("pointer-events","none");
  a.appendChild(hit);
  a.appendChild(vis);
  dest.appendChild(a);
  styleVis(vis, t, role);
}
function styleVis(vis, t, role){
  const active=hover || (ride && ride.id);
  const isRide=ride && ride.id===t.id;
  vis.removeAttribute("stroke-dasharray");
  if(role==="off"){
    vis.setAttribute("stroke","#d4c9ba"); vis.setAttribute("stroke-width","1"); vis.setAttribute("opacity",".35");
    return;
  }
  if(role==="ghost"){
    vis.setAttribute("stroke","#c4b8a8"); vis.setAttribute("stroke-width","1.4");
    vis.setAttribute("stroke-dasharray","4 5"); vis.setAttribute("opacity",".55");
    return;
  }
  const hl=(mode==="network" && t.id===active) || isRide;
  const dim=mode==="network" && active && t.id!==active;
  vis.setAttribute("stroke", hl?"#f0713f":(t.kind==="crossing"||t.kind==="route"?"#8a7f72":"#b8aea0"));
  vis.setAttribute("stroke-width", hl?4.5:(t.kind==="section"||t.kind==="pass"?1.8:2.6));
  if(t.kind==="crossing" && !hl) vis.setAttribute("stroke-dasharray","7 5");
  vis.setAttribute("opacity", dim?".22":"1");
}
function paintBadge(){
  const gB=document.getElementById("badges");
  gB.innerHTML="";
  const active=hover || (ride && ride.id);
  if(mode!=="network" || !active) return;
  const t=TRIPS.find(x=>x.id===active);
  if(!t || (t.kind!=="route" && t.kind!=="crossing")) return;
  const line=geo(t).line||[]; if(!line.length) return;
  const q=xy(line[0][0], line[0][1]);
  const url=tripHref(t);
  const a=document.createElementNS("http://www.w3.org/2000/svg","a");
  a.setAttribute("href", url);
  a.setAttributeNS("http://www.w3.org/1999/xlink","href", url);
  a.style.cursor="pointer";
  a.addEventListener("mouseenter",()=>setHover(t.id));
  a.addEventListener("mouseleave",()=>setHover(null));
  const label=String(t.num||"");
  const w=Math.max(22, label.length*7+12);
  const r=document.createElementNS("http://www.w3.org/2000/svg","rect");
  r.setAttribute("x", q[0]-w/2); r.setAttribute("y", q[1]-10);
  r.setAttribute("width", w); r.setAttribute("height", 20); r.setAttribute("rx",10);
  r.setAttribute("fill","#f0713f"); r.setAttribute("stroke","#f0713f");
  const tx=document.createElementNS("http://www.w3.org/2000/svg","text");
  tx.setAttribute("x", q[0]); tx.setAttribute("y", q[1]+4);
  tx.setAttribute("text-anchor","middle"); tx.setAttribute("font-size","11");
  tx.setAttribute("font-weight","700"); tx.setAttribute("font-family","inherit");
  tx.setAttribute("fill","#fff"); tx.setAttribute("pointer-events","none");
  tx.textContent=label;
  a.appendChild(r); a.appendChild(tx);
  gB.appendChild(a);
}
function paint(){
  document.querySelectorAll("#lines a[data-id], #ghost a[data-id]").forEach(a=>{
    const t=TRIPS.find(x=>x.id===a.dataset.id); if(!t) return;
    const vis=a.querySelector("polyline[data-vis]"); if(!vis) return;
    styleVis(vis, t, a.dataset.role);
  });
  document.querySelectorAll(".tcard[data-id]").forEach(el=>{
    el.classList.toggle("hl", hover===el.dataset.id);
  });
  paintBadge();
  pop();
  paintRide();
  applyView();
  syncMapTools();
}
function draw(){
  const gG=document.getElementById("ghost"), gL=document.getElementById("lines"), gB=document.getElementById("badges");
  const gGold=document.getElementById("gold"), gT=document.getElementById("towns"), gD=document.getElementById("discs");
  [gG,gL,gB,gGold,gT,gD].forEach(g=>g.innerHTML="");
  const showIds=new Set(visible().map(t=>t.id));
  TRIPS.forEach(t=>{
    const line=geo(t).line; if(!line||line.length<2) return;
    const on=showIds.has(t.id);
    const isRide=ride && ride.id===t.id;
    if(mode!=="network" && !isRide){ addTrip(t, gG, "ghost"); return; }
    if(!on){ addTrip(t, gG, "off"); return; }
    addTrip(t, gL, "live");
  });
  sheet();
  paint();
}

let hoverClear=null;
function setHover(id){
  if(hoverClear){ clearTimeout(hoverClear); hoverClear=null; }
  if(id==null){
    hoverClear=setTimeout(()=>{ hover=null; paint(); }, 160);
    return;
  }
  if(hover===id) return;
  hover=id;
  paint();
}
function parseHash(){
  const h=location.hash.replace(/^#/,"");
  if(!h || h==="network") return {};
  return Object.fromEntries(h.split("&").filter(Boolean).map(s=>{
    const i=s.indexOf("=");
    return i<0?[s,""]:[s.slice(0,i), decodeURIComponent(s.slice(i+1))];
  }));
}
function rideHash(id, day){
  return "trip="+id+(day?("&day="+day):"");
}
function applyHash(){
  const p=parseHash();
  if(p.trip && TRIPS.some(t=>t.id===p.trip)){
    const day=p.day?+p.day:null;
    selDay=day||null;
    if(!(mode==="ride" && ride && ride.id===p.trip)){
      if(ride && ride.id!==p.trip){ PLAN=null; effort=100; veh="bike"; startId=null; endId=null; zoom=1; folds={plan:true, route:false, days:true}; }
      ride=TRIPS.find(t=>t.id===p.trip); mode="ride"; hover=null;
      ensurePlan(p.trip);
    }
    draw();
    return;
  }
  if(mode!=="network"){ mode="network"; ride=null; hover=null; selDay=null; draw(); }
}
function openRide(id, day){
  if(!TRIPS.some(t=>t.id===id)) return;
  const h=rideHash(id, day||null);
  if(location.hash.replace(/^#/,"")!==h) location.hash=h;
  else applyHash();
}
function goNetwork(){
  zoom=1; applyView();
  if(location.hash!=="#network") location.hash="network";
  else applyHash();
}
function ensurePlan(id){
  if(PLAN && PLAN.id===id) return;
  const wanted=id;
  PLAN=null;
  fetch("data/rides/"+id+".json").then(r=>r.ok?r.json():null).then(d=>{
    if(!ride || ride.id!==wanted) return;
    PLAN=d||false;
    if(d){ effort=d.effort||100; startId=d.start; endId=d.end; zoom=1; }
    draw();
  }).catch(()=>{ if(ride && ride.id===wanted){ PLAN=false; draw(); } });
}

function townById(id){
  return ((PLAN&&PLAN.towns)||[]).find(t=>t.id===id);
}
function showName(t){
  if(!t) return "";
  if(typeof t==="string"){
    const o=((PLAN&&PLAN.towns)||[]).find(x=>x.id===t || x.name===t);
    return o?showName(o):niceName(t);
  }
  const local=t.name||"";
  if(lang==="en") return t.nameEn || EN[local] || local;
  return local;
}
function activeSegs(){
  if(!PLAN || PLAN===false) return [];
  const segs=PLAN.segs||[];
  let i0=segs.findIndex(s=>s.frm===startId);
  let i1=segs.findIndex(s=>s.to===endId);
  if(i0<0) i0=0;
  if(i1<0) i1=segs.length-1;
  if(i1<i0){ i0=0; i1=segs.length-1; }
  return segs.slice(i0, i1+1);
}
function rideStats(){
  const segs=activeSegs();
  let km=0,asc=0,signed=0;
  segs.forEach(s=>{ km+=s.km; asc+=s.ascent||0; signed+=(s.signed||0)*s.km; });
  return {km:Math.round(km), asc:Math.round(asc), signed:km?Math.round(signed/km):0};
}
function applyView(){
  const svg=document.getElementById("map");
  if(!svg) return;
  if(mode!=="ride" || zoom<=1){
    svg.setAttribute("viewBox", VB0);
    return;
  }
  const vw=W/zoom, vh=H/zoom;
  let cx=W/2, cy=H/2;
  if(selDay && PLAN && PLAN!==false){
    const d=planDays().find(x=>x.n===selDay);
    if(d && d.lat!=null){ const q=xy(d.lat,d.lon); cx=q[0]; cy=q[1]; }
  }
  let x=cx-vw/2, y=cy-vh/2;
  x=Math.max(0, Math.min(W-vw, x));
  y=Math.max(0, Math.min(H-vh, y));
  svg.setAttribute("viewBox", x.toFixed(1)+" "+y.toFixed(1)+" "+vw.toFixed(1)+" "+vh.toFixed(1));
}

  }

function scaleSeg(s, v){
  if(v==="ebike"){
    return {km:s.km, effort:Math.round(s.km+(s.effort-s.km)/3), ascent:s.ascent,
      cand:s.cand.map(c=>({...c, eff:+(c.km+(c.eff-c.km)/3).toFixed(1)}))};
  }
  if(v==="opium"){
    return {km:s.km, effort:Math.round(s.km), ascent:s.ascent,
      cand:s.cand.map(c=>({...c, eff:+(+c.km).toFixed(1)}))};
  }
  return {km:s.km, effort:s.effort, ascent:s.ascent, cand:s.cand};
}
function splitRide(plan, target, v){
  const EMIN={bike:40,ebike:32,opium:38}[v], EMAX={bike:300,ebike:160,opium:280}[v];
  const L=plan.segs.map(s=>scaleSeg(s,v));
  const c0=plan.segs[0]&&plan.segs[0].cand&&plan.segs[0].cand[0];
  const C=[{eff:0,km:0,beds:(c0&&c0.beds)||0,label:plan.startName,lat:c0&&c0.lat, lon:c0&&c0.lon}];
  let base=0,bk=0;
  const SEGS=[];
  L.forEach(s=>{
    s.cand.forEach(c=>{ if(c.km<=0) return; C.push({eff:base+c.eff, km:bk+c.km, beds:c.beds, label:c.label||(c.node||""), lat:c.lat, lon:c.lon}); });
    SEGS.push({s,k0:bk,k1:bk+s.km});
    base+=s.effort; bk+=s.km;
  });
  const n=C.length, dp=Array(n).fill(Infinity), bp=Array(n).fill(-1); dp[0]=0;
  for(let i=1;i<n;i++){
    for(let j=Math.max(0,i-160);j<i;j++){
      if(dp[j]===Infinity) continue;
      const e=C[i].eff-C[j].eff;
      if(e<EMIN||e>EMAX) continue;
      const c=dp[j]+Math.pow((e-target)/target,2)*100-Math.min(C[i].beds||0,6)*1.2-(C[i].label?14:0);
      if(c<dp[i]){ dp[i]=c; bp[i]=j; }
    }
  }
  if(dp[n-1]===Infinity){
    return [{n:1,frm:plan.startName,to:plan.endName,km:+bk.toFixed(1),eff:Math.round(base),climb:plan.stats.asc,lat:null,lon:null}];
  }
  const path=[]; let i=n-1; while(i>0){ path.push(C[i]); i=bp[i]; } path.push(C[0]); path.reverse();
  const days=[];
  for(let k=1;k<path.length;k++){
    const km=+(path[k].km-path[k-1].km).toFixed(1);
    const eff=Math.round(path[k].eff-path[k-1].eff);
    days.push({
      n:k, frm:niceName(path[k-1].label||plan.startName), to:niceName(path[k].label||plan.endName),
      km, eff, climb:Math.max(0,Math.round((eff-km)*10)),
      lat:path[k].lat, lon:path[k].lon
    });
  }
  return days;
}
function sliceLine(segs, k0, k1){
  const pts=[]; let off=0;
  segs.forEach(s=>{
    const a=Math.max(k0,off), b=Math.min(k1,off+s.km);
    if(b>a+0.05 && s.line && s.line.length){
      const t0=(a-off)/s.km, t1=(b-off)/s.km;
      const i0=Math.floor(t0*(s.line.length-1)), i1=Math.max(i0+1, Math.ceil(t1*(s.line.length-1)));
      for(let i=i0;i<=i1 && i<s.line.length;i++) pts.push(s.line[i]);
    }
    off+=s.km;
  });
  return pts;
}
function planDays(){
  if(!PLAN || PLAN===false) return [];
  const segs=activeSegs();
  const full=startId===PLAN.start && endId===PLAN.end;
  if(full && veh==="bike" && effort===PLAN.effort && PLAN.days) return PLAN.days.map(d=>({...d, frm:showName(d.frm), to:showName(d.to)}));
  const startName=showName(townById(startId)||PLAN.startName);
  const endName=showName(townById(endId)||PLAN.endName);
  return splitRide({...PLAN, segs, startName, endName}, effort, veh).map(d=>({...d, frm:showName(d.frm), to:showName(d.to)}));
}

function niceName(label){
  if(!label) return label;
  const t=(PLAN.towns||[]).find(x=>x.id===label || (x.name||"").toLowerCase()===String(label).toLowerCase());
  if(t) return t.name;
  return String(label).replace(/\b([a-z])/g,c=>c.toUpperCase());
}
function paintRide(){
  const gGold=document.getElementById("gold"), gT=document.getElementById("towns"), gD=document.getElementById("discs");
  [gGold,gT,gD].forEach(g=>g.innerHTML="");
  if(mode!=="ride" || !PLAN || PLAN===false) return;
  const days=planDays();
  const labels=[];
  const start=PLAN.towns && PLAN.towns[0];
  if(start) labels.push({name:PLAN.startName, lat:start.lat, lon:start.lon});
  days.forEach(d=>{ if(d.lat!=null) labels.push({name:niceName(d.to), lat:d.lat, lon:d.lon}); });
  labels.forEach(t=>{
    const q=xy(t.lat,t.lon);
    const tx=document.createElementNS("http://www.w3.org/2000/svg","text");
    tx.setAttribute("x", q[0]+8); tx.setAttribute("y", q[1]-8);
    tx.setAttribute("class","townlab"); tx.setAttribute("pointer-events","none");
    tx.textContent=showName(t.name);
    gT.appendChild(tx);
  });
  days.forEach(d=>{
    if(d.lat==null) return;
    const q=xy(d.lat,d.lon);
    const c=document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx", q[0]); c.setAttribute("cy", q[1]); c.setAttribute("r", 8);
    c.setAttribute("fill", selDay===d.n?"#c9a227":"#f0713f");
    c.style.cursor="pointer";

    const tx=document.createElementNS("http://www.w3.org/2000/svg","text");
    tx.setAttribute("x", q[0]); tx.setAttribute("y", q[1]+4);
    tx.setAttribute("text-anchor","middle"); tx.setAttribute("font-size","10");
    tx.setAttribute("font-weight","700"); tx.setAttribute("fill","#fff"); tx.setAttribute("pointer-events","none");
    tx.textContent=d.n;
    gD.appendChild(c); gD.appendChild(tx);
  });
  if(selDay){
    const d=days.find(x=>x.n===selDay);
    let line=d && d.line;
    if(!line || !line.length){
      let k0=0, k1=0;
      days.forEach(x=>{ if(x.n<selDay) k0+=x.km; if(x.n<=selDay) k1+=x.km; });
      line=sliceLine(activeSegs(), k0, k1);
    }
    if(line && line.length>1){
      const p=document.createElementNS("http://www.w3.org/2000/svg","polyline");
      p.setAttribute("points", linePts(line));
      p.setAttribute("fill","none"); p.setAttribute("stroke","#c9a227");
      p.setAttribute("stroke-width","6"); p.setAttribute("stroke-linecap","round"); p.setAttribute("stroke-linejoin","round");
      gGold.appendChild(p);
    }
  }
}
function gpxFor(days){
  let g='<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="bikeplanner"><metadata><name>'+PLAN.name+'</name></metadata>';
  let off=0;
  days.forEach(d=>{
    const line=(d.line&&d.line.length)?d.line:sliceLine(activeSegs(), off, off+d.km);
    off+=d.km;
    g+='<trk><name>Day '+d.n+': '+d.frm+' → '+d.to+'</name><trkseg>';
    (line||[]).forEach(p=>{ g+='<trkpt lat="'+p[0]+'" lon="'+p[1]+'"/>'; });
    g+='</trkseg></trk>';
  });
  return g+'</gpx>';
}
function csvFor(days){
  const rows=[["day","from","to","km","climb_m","effort"]];
  days.forEach(d=>rows.push([d.n,d.frm,d.to,d.km,d.climb,d.eff]));
  return rows.map(r=>r.join(",")).join("\n");
}
function download(name, text, mime){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type:mime}));
  a.download=name;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 800);
}
function drawProfile(days){
  const g=document.getElementById("prof"); if(!g) return;
  g.innerHTML="";
  const W=300,H=56;
  const pts=[]; let tot=0, lo=Infinity, hi=-Infinity;
  activeSegs().forEach(s=>{
    (s.prof||[]).forEach(q=>{ pts.push([tot+q[0], q[1]]); lo=Math.min(lo,q[1]); hi=Math.max(hi,q[1]); });
    tot+=s.km;
  });
  if(!(tot>0 && hi>lo && pts.length>1)) return;
  const span=Math.max(hi-lo,150); lo=Math.max(0,hi-span);
  let off=0;
  days.forEach((d,i)=>{
    const w=d.km/tot*W;
    const r=document.createElementNS("http://www.w3.org/2000/svg","rect");
    r.setAttribute("x",off); r.setAttribute("y",0); r.setAttribute("width",w); r.setAttribute("height",H);
    r.setAttribute("fill", selDay===d.n?"#e8d7a4":(i%2?"#efe8dc":"#e7dfd2"));
    r.style.cursor="pointer";
    r.addEventListener("click",()=>openRide(ride.id, selDay===d.n?null:d.n));
    g.appendChild(r);
    if(w>16){ const t=document.createElementNS("http://www.w3.org/2000/svg","text");
      t.setAttribute("x",off+3); t.setAttribute("y",H-5); t.setAttribute("font-size","9"); t.setAttribute("fill","#6f675e"); t.textContent=d.n; g.appendChild(t); }
    off+=w;
  });
  const d=pts.map(q=>(q[0]/tot*W).toFixed(1)+","+(4+(1-(q[1]-lo)/span)*(H-12)).toFixed(1)).join(" ");
  const f=document.createElementNS("http://www.w3.org/2000/svg","polyline");
  f.setAttribute("points","0,"+H+" "+d+" "+W+","+H); f.setAttribute("fill","#f0713f"); f.setAttribute("fill-opacity",".2"); g.appendChild(f);
  const l=document.createElementNS("http://www.w3.org/2000/svg","polyline");
  l.setAttribute("points",d); l.setAttribute("fill","none"); l.setAttribute("stroke","#f0713f"); l.setAttribute("stroke-width","1.3"); g.appendChild(l);
  const hiEl=document.getElementById("profhi"), loEl=document.getElementById("proflo");
  if(hiEl) hiEl.textContent="▲ "+Math.round(hi).toLocaleString()+" m";
  if(loEl) loEl.textContent="▼ "+Math.round(lo).toLocaleString()+" m";
}

        <div class="phs">${photos.map(src=>`<div style="background-image:url('${src}')"></div>`).join("")}</div></div>`;
    }
    li.innerHTML=`<span class="n">${d.n}</span><div><div class="who">${d.frm} → ${d.to}</div>
      <div class="meta">${d.km} km · ${d.climb||"—"} m</div></div>${extra}`;
    li.onclick=()=>openRide(ride.id, selDay===d.n?null:d.n);
    box.appendChild(li);
  });
}
function sparkPoly(d){
  const W=300,H=26, mx=Math.max.apply(null,d.prof.map(p=>p[1])), top=Math.max(100,mx);
  const pts=d.prof.map(p=>(p[0]/d.km*W).toFixed(1)+","+(H-2-(p[1]/top)*(H-6)).toFixed(1)).join(" ");
  return `<polyline points="0,${H-2} ${pts} ${W},${H-2}" fill="#f0713f" fill-opacity=".18" stroke="none"/>
    <polyline points="${pts}" fill="none" stroke="#f0713f" stroke-width="1.2"/>`;
}

function sheet(){
  const head=document.getElementById("head");
  const col=document.getElementById("col");
  const plannerOn=mode==="ride" && PLAN && PLAN!==false && PLAN.id===ride.id;
  document.documentElement.classList.toggle("planner", plannerOn);
  document.body.classList.toggle("planner", plannerOn);
  if(mode==="network"){
    col.className="";
    const n=visible().length;
    head.innerHTML=`<a class="back" href="hub.html">‹ Where to ride</a>
      <p class="kicker">Switzerland · ${TRIPS.length} trips</p>
      <h1>Switzerland by bike</h1>
      <p class="lede">National routes, pass days and lake loops. Hover a line or a card. Click either to open the tour sheet on this page. Days are computed from effort — the number is a default, not a timetable.</p>
      <div class="chips" id="filters"></div>`;
    filterChips().forEach(([k,lab])=>{
      const b=document.createElement("button"); b.className="chip"+(filter===k?" on":""); b.textContent=lab;
      b.onclick=()=>{ filter=k; draw(); };
      document.getElementById("filters").appendChild(b);
    });
    col.innerHTML=`<p class="tm" style="margin:0 0 10px">${n} trip${n===1?"":"s"}</p><div id="cards"></div>
      <p class="note">Same catalogue as the old picker. The map is a figure of the country — lakes and the line, not tiles. This page is the product, not a doorway to the dark planner.</p>`;
    const box=document.getElementById("cards");
    visible().sort((a,b)=>(a.top||99)-(b.top||99)).forEach(t=>{
      const g=geo(t), d=grade(g.km,g.asc);
      const el=document.createElement("div");
      el.className="tcard"+(hover===t.id?" hl":"");
      el.dataset.id=t.id;
      el.innerHTML=`<div class="ph" style="background-image:url('${photo(t)}')"></div>
        <div class="b"><div class="tn"><span class="badge">${t.num}</span><h2>${t.name}</h2>
        <span class="dl dl${d}">${DNAME[d]}</span>${t.top?`<span class="top">${topLabel(t.top)}</span>`:""}</div>
        ${t.why?`<div class="why">${t.why}</div>`:""}
        <div class="tm">${t.sub} · ${g.km||"—"} km · ${(g.asc||0).toLocaleString()} m · ~${g.n||"—"} days</div></div>`;
      el.onmouseenter=()=>setHover(t.id);
      el.onmouseleave=()=>setHover(null);
      el.onclick=()=>openRide(t.id);
      box.appendChild(el);
    });
  } else {
    const t=ride, g=geo(t), d=grade(g.km,g.asc);
    if(PLAN && PLAN.id===t.id){
      plannerSheet(t);
    } else if(PLAN===false){
      col.className="";
      head.innerHTML=`<button class="back" id="up">‹ All trips</button>
        <p class="kicker">Your tour, planned</p>
        <h1>${t.name}</h1>
        <p class="lede">${t.sub}${t.why?" · "+t.why:""}</p>`;
      document.getElementById("up").onclick=goNetwork;
      col.innerHTML=`
        <div class="tn" style="margin-bottom:8px"><span class="badge">${t.num}</span>
          <span class="dl dl${d}">${DNAME[d]}</span>${t.top?`<span class="top">${topLabel(t.top)}</span>`:""}</div>
        <div class="stats">
          <div><b>${g.n||"—"}</b><span>days</span></div>
          <div><b>${g.km||"—"}</b><span>km</span></div>
          <div><b>${(g.asc||0).toLocaleString()}</b><span>m climbed</span></div>
        </div>
        <p class="tm">${(t.tags||[]).join(" · ")}${t.note?" · "+t.note:""}</p>
        <p class="note">The atlas marks this ride. The full planner example is on Rhône for now — days, elevation, forks and GPX from the Swiss graph.</p>`;
    } else {
      col.className="";
      head.innerHTML=`<button class="back" id="up">‹ All trips</button>
        <p class="kicker">Your tour, planned</p>
        <h1>${t.name}</h1>
        <p class="lede">${t.sub}${t.why?" · "+t.why:""}</p>`;
      document.getElementById("up").onclick=goNetwork;
      col.innerHTML=`<p class="ghost">Loading the ride from the Swiss graph…</p>`;
    }
  }
}
function pop(){
  const pop=document.getElementById("pop");
  if(mode!=="network" || !hover){
    pop.style.display="none";
    pop.removeAttribute("href");
    return;
  }
  const t=TRIPS.find(x=>x.id===hover); if(!t) return;
  const url=tripHref(t);
  const line=geo(t).line||[]; const pt=line[0]||[46.8,8.2]; const q=xy(pt[0], pt[1]);
  const st=document.getElementById("stage").getBoundingClientRect();
  pop.href=url;
  pop.innerHTML=`<b>${t.num} · ${t.name}</b><div class="tm" style="margin:0">${geo(t).km||""} km</div><span class="cta">open the tour sheet ›</span>`;
  pop.style.display="block";
  pop.style.left=Math.min(st.width-250, Math.max(8, q[0]*(st.width/W)-40))+"px";
  pop.style.top=Math.max(8, q[1]*(st.height/H)-24)+"px";
}

const popEl=document.getElementById("pop");
popEl.addEventListener("mouseenter",()=>{ if(hoverClear){ clearTimeout(hoverClear); hoverClear=null; } });
popEl.addEventListener("mouseleave",()=>setHover(null));

document.getElementById("mapback").onclick=goNetwork;
document.getElementById("vehbtn").onclick=()=>{
  const i=VEH_ORDER.indexOf(veh);
  setVeh(VEH_ORDER[(i+1)%VEH_ORDER.length]);
};
document.getElementById("langbtn").onclick=()=>{ lang=lang==="local"?"en":"local"; draw(); };
document.getElementById("fitbtn").onclick=()=>{
  zoom=1;
  if(ride) openRide(ride.id, null);
  else applyView();
};
document.getElementById("zin").onclick=()=>{ zoom=Math.min(2.4, +(zoom+0.35).toFixed(2)); applyView(); };
document.getElementById("zout").onclick=()=>{ zoom=Math.max(1, +(zoom-0.35).toFixed(2)); applyView(); };

document.addEventListener("keydown",e=>{ if(e.key==="Escape" && mode!=="network") goNetwork(); });
window.addEventListener("hashchange", applyHash);

Promise.all([
  fetch("data/switzerland-trips.json").then(r=>r.json()),
  fetch("data/switzerland_outline.geojson").then(r=>r.json()),
  fetch("data/switzerland_water.geojson").then(r=>r.json())
]).then(([trips, land, water])=>{
  TRIPS=trips.trips||trips;
  drawBase(land, water);
  applyHash();
  if(mode==="network") draw();
});
</script>
